<title>Doctor Career Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one reading column for a phone or a laptop, sticky tab strip on top, and a fixed audio transport along the bottom whenever a lesson is loaded. Lesson text is set in a book face because it is read as well as heard; numbers are monospaced like a chart. */
:root{
  --paper:#f2f5f4; --card:#ffffff; --ink:#12242b; --muted:#55686f; --line:#d5dedc;
  --teal:#0d6e6a; --teal-ink:#ffffff; --teal-soft:#dcefec; --amber:#a8690a; --amber-soft:#f8edd6;
  --good:#1b7a4e; --good-soft:#dff2e7; --bad:#b23a2a; --bad-soft:#fae6e2;
  --read:"IBM Plex Serif",Georgia,"Times New Roman",serif; --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1517; --card:#142023; --ink:#e3ecea; --muted:#93a6a6; --line:#24363a;
  --teal:#5fc9bf; --teal-ink:#0c1517; --teal-soft:#16302f; --amber:#eab455; --amber-soft:#2e2613;
  --good:#55c591; --good-soft:#143021; --bad:#f0836f; --bad-soft:#3a1d18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1517; --card:#142023; --ink:#e3ecea; --muted:#93a6a6; --line:#24363a;
  --teal:#5fc9bf; --teal-ink:#0c1517; --teal-soft:#16302f; --amber:#eab455; --amber-soft:#2e2613;
  --good:#55c591; --good-soft:#143021; --bad:#f0836f; --bad-soft:#3a1d18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px 150px}
h1,h2,h3{font-family:var(--read);font-weight:600;line-height:1.22;text-wrap:balance;margin:0}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0} a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 4px}
.brand{font-family:var(--read);font-weight:600;font-size:1.15rem}
.sync{font-size:.78rem;color:var(--muted)} .sync[data-warn="1"]{color:var(--amber)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--teal-soft);color:var(--teal);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plain{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.btn{font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.link{border:0;background:none;color:var(--teal);padding:4px 0}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input[type=text],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;flex:1;min-width:150px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:8px 12px;cursor:pointer;flex:1;white-space:nowrap;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:600}
.note{background:var(--amber-soft);border-radius:9px;padding:10px 12px;font-size:.88rem}
.err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:10px 12px;font-size:.88rem}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.chip.warn{background:var(--amber-soft);color:var(--amber)} .chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.off{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fig{display:flex;flex-direction:column;gap:2px;min-width:0}
.fig b{font-family:var(--num);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.fig span{font-size:.76rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.day i{display:block;width:100%;height:8px;border-radius:4px;background:var(--line)}
.day[data-on="1"] i{background:var(--teal)} .day[data-today="1"]{color:var(--ink);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px}
.bars div{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars div[data-z="1"]{background:var(--line)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px;flex:1}
.meter i{display:block;height:100%;background:var(--teal)}
/* lists */
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
/* lesson text */
.lesson{font-family:var(--read);font-size:1.06rem;line-height:1.7;max-width:66ch}
.lesson section{padding:10px 12px;margin-inline:-12px;border-radius:8px;display:flex;flex-direction:column;gap:6px}
.lesson section[data-now="1"]{background:var(--teal-soft)}
.lesson h3{font-size:1.02rem}
ul.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
/* questions */
.stem{font-family:var(--read);font-size:1.04rem;line-height:1.65;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;cursor:pointer;width:100%}
.opt b{font-family:var(--num);font-weight:500;color:var(--muted)}
.opt[data-s="right"]{border-color:var(--good);background:var(--good-soft)}
.opt[data-s="wrong"]{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{flex:1;min-width:52px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted)}
.rate button b{font-family:var(--num);font-size:1.05rem;color:var(--ink);font-weight:500}
.rate button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.md p+p,.md ul+p,.md p+ul{margin-top:8px} .md ul{margin:0;padding-left:20px}
.msg{border-radius:12px;padding:10px 13px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--teal-soft)} .msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.flash{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;min-height:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;font-family:var(--read);font-size:1.14rem;line-height:1.55}
.flash .a{border-top:1px solid var(--line);padding-top:12px}
.flash .eyebrow{font-family:var(--ui)}
.conf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.conf button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;line-height:1.2;color:var(--muted);min-width:0;text-align:center}
.conf button b{font-family:var(--num);font-size:1.05rem;color:var(--ink);font-weight:500}
.clist{display:flex;flex-direction:column;gap:14px;font-family:var(--read);max-width:66ch}
.clist div{display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line);padding-bottom:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;border:0;border-radius:99px;background:var(--ink);color:var(--paper);padding:12px 20px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.fab[data-up="1"]{bottom:calc(158px + env(safe-area-inset-bottom,0px))}
.askp{position:fixed;right:0;bottom:0;z-index:12;width:min(440px,100%);height:min(80%,660px);background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
.askp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.askp .log{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.askp .ft{padding:10px 16px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.askp textarea{min-height:52px;max-height:120px}
.aipick{display:flex;align-items:center;gap:6px;min-width:0}.aipick select{width:auto;max-width:190px;padding:6px 8px;font-size:.85rem}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.caveat{background:var(--amber-soft);border-radius:8px;padding:8px 11px;font:500 .86rem/1.45 var(--ui)}
.caveat b{color:var(--amber)}
.land{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 34px;gap:8px;align-items:center}
.ln{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.lbar{position:relative;height:12px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat}
.lbar i{position:absolute;top:1px;bottom:1px;border-radius:3px}
.lbar i.neg{right:50%;background:var(--amber)} .lbar i.pos{left:50%;background:var(--teal)}
.lv{text-align:right}
.ltab{font-family:var(--ui);font-size:.86rem;margin-top:4px}
.ltab caption{text-align:left;font-weight:600;padding-bottom:6px}
.ltab th,.ltab td{white-space:normal;vertical-align:top;min-width:84px}
.ltab td:first-child{font-weight:600}
.fig{margin:4px 0 0;display:flex;flex-direction:column;gap:6px;font:400 .86rem/1.45 var(--ui)}
.fig img{max-width:100%;height:auto;border-radius:8px;border:1px solid var(--line);align-self:flex-start;display:block}
.figimg{min-height:24px}
.figimg.wide{overflow-x:auto;max-width:100%}
.figimg.wide img{max-width:none;width:max(100%,680px);background:#fff}
figure.fig figcaption b{font:600 .9rem/1.4 var(--ui)}
.pager{display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;padding-top:6px}
.pager button{min-width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-family:var(--num);font-size:.85rem}
.pager button[aria-current="true"]{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:600}
.pager button[data-now="1"]:not([aria-current="true"]){border-color:var(--teal);color:var(--teal)}
.pager button:disabled{opacity:.4;cursor:default}
.pager span{color:var(--muted);padding:0 2px}
/* audio transport */
.player{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.player .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{border:1px solid var(--line);background:var(--card);border-radius:50%;width:42px;height:42px;cursor:pointer;display:grid;place-items:center;flex:none}
.ctl button.big{width:54px;height:54px;background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .sp{border-radius:9px;width:auto;padding:0 10px;font-family:var(--num);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:9px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
</style>
<div class="wrap">
  <div class="top"><span class="brand">Doctor Career Companion</span><span class="sync" id="sync"></span></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <main id="app" class="stack"><p class="muted">Loading your record…</p></main>
</div>
<div class="player" id="player" hidden></div>
<button class="fab" id="fab" data-act="askopen" aria-label="Ask the study companion">Ask</button>
<div class="askp" id="askp" role="dialog" aria-label="Study companion" hidden></div>
<div class="toast" id="toast" hidden></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,44);
const dayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pct=(a,b)=>b?Math.round(100*a/b):0;
/* The AI's JSON is not guaranteed to keep its shape: a list can come back as a single string or be missing. A() always yields a list. */
const A=v=>Array.isArray(v)?v:(v==null||v===''||v===false)?[]:[v];
const hm=m=>{m=Math.round(m);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'};
let toastT=null;function toast(t,ms=3500){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms)}
/* A table from the AI, cut to a safe size. Tables are visual aids: they are shown, never read aloud. */
const cleanTable=x=>{if(!x||typeof x!=='object')return null;const c=A(x.columns).map(v=>String(v).slice(0,80)).slice(0,8),r=A(x.rows).filter(Array.isArray).map(row=>row.slice(0,c.length||8).map(v=>String(v??'').slice(0,260))).filter(row=>row.some(Boolean)).slice(0,30);return c.length>=2&&r.length>=2?{t:String(x.title||'').slice(0,140),c,r}:null};
const tableHTML=tb=>tb?`<div class="tablewrap"><table class="ltab">${tb.t?`<caption>${esc(tb.t)}</caption>`:''}<thead><tr>${tb.c.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${tb.r.map(r=>`<tr>${tb.c.map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
function mdTables(t){const lines=String(t||'').split(/\n/),out=[];let buf=[];const flush=()=>{if(buf.length>=2){const rows=buf.filter(l=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim().replace(/\*\*/g,'')));const tb=cleanTable({columns:rows[0],rows:rows.slice(1)});out.push(tb?{tb}:buf.join('\n'))}else out.push(...buf);buf=[]};
  lines.forEach(l=>{if(/^\s*\|.*\|\s*$/.test(l))buf.push(l);else{flush();out.push(l)}});flush();return out}
function md(t){if(/^\s*\|.*\|\s*$/m.test(String(t||''))){let txt=[];const parts=[];mdTables(t).forEach(x=>{if(typeof x==='string')txt.push(x);else{if(txt.length){parts.push(md0(txt.join('\n')));txt=[]}parts.push(tableHTML(x.tb))}});if(txt.length)parts.push(md0(txt.join('\n')));return parts.join('')}return md0(t)}
const speakable=t=>mdTables(t).map(x=>typeof x==='string'?x:'There is a table on screen for this.').join('\n').replace(/[*#_`|]/g,'');
function md0(t){const out=[];let ul=null;String(t||'').split(/\n/).forEach(l=>{const li=/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(l);const f=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*/,'');
  if(li){if(!ul){ul=[];out.push(ul)}ul.push('<li>'+f(li[1])+'</li>')}else{ul=null;if(l.trim())out.push('<p>'+(/^#{1,4}\s/.test(l)?'<b>'+f(l)+'</b>':f(l))+'</p>')}});
  return '<div class="md">'+out.map(x=>Array.isArray(x)?'<ul>'+x.join('')+'</ul>':x).join('')+'</div>'}
const thinking=t=>`<div class="thinking"><span class="dot"></span><span>${esc(String(t).replace(/^Claude/,aiName()))}</span></div>`;

/* ---------- Curriculum ----------
   Four tracks. Internal medicine follows the subject divisions of a board review syllabus; the other three are the practice-building tracks.
   w = how much the planner favors a section (3 = core outpatient). A trailing ~ marks a topic that is mainly hospital medicine.
   lib = folder titles in the reference library (Google Drive) that hold this section's chapters. */
const TRACKS=[
 {id:'im',name:'Internal Medicine',blurb:'Board content by body system',sections:[
  {id:'cv',name:'Cardiovascular Medicine',w:3,lib:['Cardiology'],src:'ACC/AHA, ESC, USPSTF',topics:['Hypertension','Lipid management and ASCVD risk','Chronic coronary disease','Acute coronary syndromes~','Heart failure','Atrial fibrillation and anticoagulation','Arrhythmias and syncope','Valvular heart disease','Peripheral artery and aortic disease','Preoperative cardiac evaluation','Pericardial and myocardial disease~','Adult congenital and pregnancy-related heart disease']},
  {id:'endo',name:'Endocrinology and Metabolism',w:3,lib:['Endocrinology'],src:'ADA Standards of Care, Endocrine Society, AACE, ATA, BHOF',topics:['Type 2 diabetes','Type 1 diabetes and insulin management','Obesity medicine','Thyroid disorders','Thyroid nodules and cancer','Osteoporosis and bone health','Calcium and parathyroid disorders','Adrenal disorders','Pituitary disorders','Male hypogonadism','Menopause and female reproductive endocrinology','Hyperglycemic emergencies and inpatient glycemic control~']},

/* ---------- The board blueprint ----------
   The ABIM publishes what its internal medicine examination covers: content categories with a share of the exam each, and under them
   topics rated high, medium or low relevance for four tasks. The physician keeps that document in Google Drive; the page reads it once,
   keeps the parsed outline in the record, and builds a Boards track from it so lessons, questions and cards follow the exam itself. */
function parseBlueprint(text){const u=s=>s.replace(/\\+/g,'').trim(),cats=[],by={};let cur=null,sub='',started=false;
  text.split('\n').forEach(raw=>{const l=u(raw);let m;
    if(!started&&(m=/^\|\s*([A-Z][A-Za-z ,&\/\-]+?)\s*\|\s*(\d+(?:\.\d+)?)%\s*\|/.exec(l))){const c={name:m[1].trim(),pct:Number(m[2]),topics:[]};if(!by[c.name.toUpperCase()]){by[c.name.toUpperCase()]=c;cats.push(c)}return}
    if((m=/\*\*([A-Z][A-Z ,&\/\-]+?)\*\*/.exec(l))&&by[m[1].trim()]){cur=by[m[1].trim()];started=true;if(!/% of exam/.test(l.replace(m[0],''))||/^\|/.test(l))return}
    if((m=/^\*\*([A-Z][^*]+?)\*\*\s*\*[^(]*\(\s*<?\s*\d+(?:\.\d+)?\s*% of exam\)/.exec(l))&&!by[m[1].trim()]){sub=m[1].trim();return}
    if(cur&&(m=/^\|\s*(.+?)\s*\|\s*\*\*(HIGH|MEDIUM|LOW)\*\*\s*\|\s*\*\*(HIGH|MEDIUM|LOW)\*\*\s*\|\s*\*\*(HIGH|MEDIUM|LOW)\*\*\s*\|\s*\*\*(HIGH|MEDIUM|LOW)\*\*/.exec(l))){
      const lf=/\*\*LF\*\*/.test(m[1])||/L[a-z]?F(?=[a-z])/.test(m[1]),name=m[1].replace(/\*\*LF\*\*/g,'').replace(/L([a-z]?)F(?=[a-z])/,'$1').replace(/\*/g,'').replace(/\s+/g,' ').trim();
      if(!cur.topics.some(t=>t.n===name))cur.topics.push({n:name,lf:lf?1:0,sub:sub.charAt(0)+sub.slice(1).toLowerCase(),r:m.slice(2,6).map(x=>x[0]).join('')})}});
  return cats.filter(c=>c.topics.length)}
/* Reads the blueprint straight from the ABIM's PDF. The PDF is a table laid out by position, so this works from where each piece of
   text sits on the page: four ratings on one line make a row, and the topic name is the text to their left on the nearest lines. */
function parseBlueprintPages(pages){const R={HIGH:'H',MEDIUM:'M',LOW:'L'},cats=[],by={};let cur=null,sub='';
  const join=it=>it.reduce((s,i,k)=>s+(k&&i.x-(it[k-1].x+(it[k-1].w||0))>1.5?' ':'')+i.s,'').replace(/\s+/g,' ').trim();
  const lines=items=>{const out=[];items.slice().sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const l=out.find(o=>Math.abs(o.y-i.y)<=2.5);if(l)l.it.push(i);else out.push({y:i.y,it:[i]})});
    out.forEach(l=>l.it.sort((a,b)=>a.x-b.x));return out};
  const caps=s=>{const a=s.replace(/[^A-Za-z]/g,'');return a.length>2&&a.replace(/[^A-Z]/g,'').length/a.length>=.8};
  pages.forEach(items=>{items=items.filter(i=>i.s&&i.s.trim()).map(i=>({s:i.s.trim(),x:i.x,y:i.y,w:i.w}));
    const rate=items.filter(i=>R[i.s]),rows=lines(rate).filter(l=>l.it.length===4);
    if(!rows.length){if(!cats.some(c=>c.topics.length))lines(items).forEach(l=>{for(let k=0;k+1<l.it.length;k++){const n=l.it[k].s,p=/^(\d+(?:\.\d+)?)%$/.exec(l.it[k+1].s);
        if(p&&/^[A-Z][A-Za-z ,&\/\-]+$/.test(n)&&!/^total$/i.test(n)&&!by[n.toUpperCase()]){const c={name:n,pct:Number(p[1]),topics:[]};by[n.toUpperCase()]=c;cats.push(c)}}});return}
    const edge=Math.min(...rate.map(i=>i.x))-4,near=(y,lim)=>{let best=null,d=lim;rows.forEach(r=>{const v=Math.abs(r.y-y);if(v<=d){d=v;best=r}});return best};
    lines(items.filter(i=>!R[i.s])).sort((a,b)=>b.y-a.y).forEach(l=>{const li=l.it.filter(i=>i.x<edge);if(!li.length)return;const all=join(l.it);
      if(li.some(i=>i.s==='LF')){const r=near(l.y,9);if(r)r.lf=1}
      const s=join(li.filter(i=>i.s!=='LF'));if(!s)return;
      const up=s.replace(/\s*continued….*$/,'').replace(/\s*\(<?\s*\d+(?:\.\d+)?\s*% of exam\)\*?\s*$/,'').trim();
      if(by[up.toUpperCase()]&&caps(up)){cur=by[up.toUpperCase()];return}
      if(/^continued…/.test(s)||/^\(<?\s*\d+(?:\.\d+)?\s*% of exam\)/.test(s)||/^NOTE\b/.test(s))return;
      if(/% of exam\)/.test(all)&&up&&caps(up)){sub=up;return}
      const r=near(l.y,20);if(!r||!cur)return;r.cat=r.cat||cur;r.sub=r.sub==null?sub:r.sub;(r.name||(r.name=[])).push({y:l.y,s})});
    rows.sort((a,b)=>b.y-a.y).forEach(r=>{if(!r.name||!r.cat)return;let name=r.name.sort((a,b)=>b.y-a.y).map(l=>l.s).join(' ').replace(/\*/g,'').replace(/\s+/g,' ').trim();
      if(/L[a-z]F(?=[a-z])/.test(name)){name=name.replace(/L([a-z])F(?=[a-z])/,'$1');r.lf=1}
      if(name&&!r.cat.topics.some(t=>t.n===name))r.cat.topics.push({n:name,lf:r.lf?1:0,sub:r.sub.charAt(0)+r.sub.slice(1).toLowerCase(),r:r.it.map(i=>R[i.s]).join('')})})});
  return cats.filter(c=>c.topics.length)}

/* The first-time Certification blueprint is laid out differently: no ratings, just an indented outline. A category sits at the margin
   with its share of the exam, a subsection is indented under it with its own share, and topics are indented under that. */
function parseOutlinePages(pages){const cats=[],by={};let cur=null,sub=null,last=null,x0=null,xs=null,xt=null,note=false,pre='';
  const join=it=>it.reduce((s,i,k)=>s+(k&&i.x-(it[k-1].x+(it[k-1].w||0))>1.5?' ':'')+i.s,'').replace(/\s+/g,' ').replace(/\s+([,;:)])/g,'$1').trim();
  const PCT=/\s*(<)?\s*(\d+(?:\.\d+)?)\s*%(?:\s*of exam)?\s*$/i,flush=()=>{if(cur&&sub&&!sub.n){cur.topics.push({n:sub.name,lf:0,sub:sub.name,r:'',sp:sub.sp});sub.n=1}};
  pages.forEach(items=>{const out=[];items.filter(i=>i.s&&i.s.trim()).map(i=>({s:i.s.trim(),x:i.x,y:i.y,w:i.w})).sort((a,b)=>b.y-a.y||a.x-b.x).forEach(i=>{const l=out.find(o=>Math.abs(o.y-i.y)<=2.5);if(l)l.it.push(i);else out.push({y:i.y,it:[i]})});
    out.sort((a,b)=>b.y-a.y).forEach(l=>{l.it.sort((a,b)=>a.x-b.x);const x=l.it[0].x,s=join(l.it);if(!s||/^\d+$/.test(s))return;const m=PCT.exec(s);let name=m?s.slice(0,m.index).trim():s;
      if(m&&by[name.toUpperCase()]&&(by[name.toUpperCase()].seen||cats.length>=5&&x0!=null)){flush();cur=by[name.toUpperCase()];cur.seen=1;sub=null;last=null;note=false;x0=x;return}
      if(!cur){if(m&&!m[1]&&/^[A-Z][A-Za-z ,&\/\-]+$/.test(name)&&!/^total$/i.test(name)&&!by[name.toUpperCase()]){const c={name,pct:Number(m[2]),topics:[]};by[name.toUpperCase()]=c;cats.push(c);x0=x}
        else if(cats.length>=5&&/^total\b/i.test(name)){x0=0;cur=null}
        return}
      if(m&&x>x0+10&&(xt==null||x<xt-10)){flush();if(pre){name=pre+' '+name;pre=''}else xs=x;xt=null;note=/\(NOTE\b/.test(name)&&!/\)\s*$/.test(name);sub={name:name.replace(/\s*\(NOTE\b.*$/,'').trim(),sp:m[1]?0:Number(m[2]),n:0};last=null;return}
      if(!sub)return;
      if(!m&&xs!=null&&Math.abs(x-xs)<3&&!note&&(sub.n||!/\(/.test(sub.name)||/\)/.test(sub.name))){pre=s;return}
      if(xs!=null&&x<xs+20){if(note){if(/\)\s*$/.test(s))note=false}else if(!sub.n&&x>xs)sub.name+=' '+s;return}

const diffRow=()=>`<div class="plain" style="flex-basis:100%"><span class="small" style="font-weight:600">Difficulty</span>${segBtns('qd',[1,2,3,4,5].map(n=>[n,String(n)]),qD())}<span class="small muted"><b>${DIFF[qD()][0]}.</b> ${qD()===3?'A typical ABIM examination question.':qD()<3?'Easier than the examination; good for a first pass at a topic.':'Harder than the examination; good once a topic feels solid.'}</span></div>`;
const segBtns=(name,opts,cur)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button data-set="${name}" data-v="${v}" aria-pressed="${String(cur)===String(v)}">${esc(l)}</button>`).join('')}</div>`;

   <div class="plain"><span class="eyebrow">How much today</span>${segBtns('commit',Object.entries(COMMIT).map(([k,v])=>[k,v.name+' · '+v.min+' min']),st.prefs.commit)}<span class="small muted">${c.sub}. Lessons play one after another; the text follows along on screen. Change any of these lengths in Settings.</span></div>

   ${modeRow()}
   <div class="plain"><span class="eyebrow">Up next, chosen from your record</span>${pl.slice(0,c.lessons).map(r=>`<div class="row between" style="flex-wrap:nowrap"><div style="min-width:0"><b>${esc(r.t.name)}</b><div class="tiny muted">${esc(r.t.sec.name)} · ${esc(r.why)}</div></div></div>`).join('')}</div>
   <div class="row"><button class="btn pri" data-act="session">${IC.play.replace('<svg','<svg width="16" height="16" fill="currentColor"')} ${st.prefs.auto?'Listen to':'Read'} a ${c.min}-minute session</button>${due?`<button class="btn" data-act="review">Review ${due} missed question${due>1?'s':''}</button>`:''}${dueCards('all').length?`<button class="btn" data-act="cduetoday">Flip ${dueCards('all').length} due card${dueCards('all').length>1?'s':''}</button>`:''}</div>
   ${SAMPLE?'':'<div class="note">The AI is not available in this view, so new lessons and questions cannot be written here. Saved lessons still play.</div>'}${TTS?'':'<div class="note">This browser has no speech voice. Lessons show as text only.</div>'}</div>`}
  ${S.busy?'':`<div class="card"><h3>Request a topic</h3><p class="small muted">Name anything and it is taught, tested or turned into cards now. It is filed under the matching curriculum topic, or kept under My topics if there is none.</p>
   ${modeRow()}<label class="f">Topic<input type="text" id="reqtext" placeholder="e.g. hyponatremia workup, or anticoagulation around procedures"></label>
   <div class="row">${Object.entries(LEN).map(([k,v])=>`<button class="btn ${k==='std'?'pri':''}" data-act="req" data-kind="${k}">${v.name} · ${v.min} min</button>`).join('')}<button class="btn" data-act="req" data-kind="quiz">Questions</button><button class="btn" data-act="req" data-kind="cards">Cards</button></div></div>
  <div class="card"><h3>Academic half day</h3><p class="small muted">Add what your program is teaching and when. In the week before, that topic moves to the front of your sessions so you arrive prepared.</p>
   ${A(st.ahd).filter(a=>a.date>=dayStr()).sort((x,y)=>x.date<y.date?-1:1).map(a=>`<div class="plain" style="border-top:1px solid var(--line);padding-top:8px"><div class="row between"><div style="min-width:0;flex:1"><b>${esc(a.text)}</b><div class="tiny muted">${new Date(a.date+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}${TOP[a.tid]?' · filed under '+esc(TOP[a.tid].sec.name):''}${started(a.tid)?' · prepared':''}</div></div><button class="btn sm" data-act="ahddel" data-id="${a.id}" aria-label="Remove">Remove</button></div>
     <div class="row"><button class="btn sm" data-act="ahdprep" data-id="${a.id}" data-kind="short">Quick prep · ${LEN.short.min} min</button><button class="btn sm" data-act="ahdprep" data-id="${a.id}" data-kind="deep">Deep dive · ${LEN.deep.min} min</button><button class="btn sm" data-act="ahdprep" data-id="${a.id}" data-kind="quiz">Questions</button><button class="btn sm" data-act="ahdprep" data-id="${a.id}" data-kind="cards">Cards</button></div></div>`).join('')}
   <div class="row"><label class="f">Date<input type="date" id="ahddate" style="background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px"></label><label class="f" style="flex:2">Topic<input type="text" id="ahdtext" placeholder="e.g. Heart failure with reduced ejection fraction"></label></div><div class="row"><button class="btn" data-act="ahdadd">Add to the schedule</button></div></div>`}

  ${gaps.length?`<div class="card"><h3>Your stated gaps</h3>${gaps.slice(0,5).map(g=>`<div class="row between"><div style="min-width:0;flex:1"><b>${esc(g.text)}</b><div class="tiny muted">${esc(TOP[g.tid]?TOP[g.tid].name:'')}${g.n?` · ${g.c}/${g.n} correct`:''}</div></div><button class="btn sm" data-act="gaplearn" data-id="${g.id}">Teach</button><button class="btn sm" data-act="gapquiz" data-id="${g.id}">Test</button></div>`).join('')}</div>`:''}
  <div class="card"><div class="row between"><h3>Chief resident's brief</h3><button class="btn sm" data-act="brief" ${S.busy||!SAMPLE?'disabled':''}>${S.brief?'Refresh':'Get my brief'}</button></div>${S.brief?md(S.brief)+`<div class="row"><button class="btn sm" data-act="saytext" data-k="brief">Listen</button></div>`:'<p class="small muted">A short read on what your record shows: where you are strong, what is slipping, and what to do this week.</p>'}</div>`}

/* ----- Boards: the blueprint as a study plan ----- */
function vBoards(){
  if(!hasBP())return `<div class="plain"><h1>Boards</h1><p class="small muted">Board study follows the ABIM's own published blueprint: every content category with its share of the exam, and every topic rated by how likely it is to be tested.</p></div>${busy()}
   ${S.busy?'':`<div class="card"><h3>Load your blueprint</h3><p class="small muted">${MCP?'The page reads the blueprint document from your Google Drive once and keeps the outline in your record.':WEB?'Load the blueprint once inside Claude, where Google Drive is connected. It then appears here with the rest of your record.':'Google Drive is not connected to this page.'}</p>${MCP?`<label class="f">Document title contains<input type="text" id="bpname" value="${esc(st.prefs.bpName)}"></label><div class="row"><button class="btn pri" data-act="bpload">Load from Google Drive</button></div>`:''}</div>`}`;
  const tr=TRACKS[0],b=bpDoc(),rows=tr.sections.map(s=>({s,x:secStats(s),y:bpSec(s)})),ready=Math.round(rows.reduce((a,r)=>a+r.s.pct*r.y.ready,0)/rows.reduce((a,r)=>a+r.s.pct,0));
  const hi=rows.reduce((a,r)=>a+r.y.hi,0),hs=rows.reduce((a,r)=>a+r.y.hs,0),n=rows.reduce((a,r)=>a+r.x.n,0),c=rows.reduce((a,r)=>a+r.x.c,0),cm=COMMIT[st.prefs.commit],pl=plan(Math.max(3,cm.lessons),'abim');
  const days=st.prefs.examDate?Math.ceil((new Date(st.prefs.examDate+'T12:00:00')-Date.now())/864e5):null;
  return `<div class="plain"><h1>Boards</h1><p class="small muted">${esc(b.title)} · ${tr.sections.length} categories · ${tr.sections.reduce((a,s)=>a+s.t.length,0)} topics</p></div>
  ${examCard()}
  <div class="card"><div class="figs"><div class="fig"><b>${ready}</b><span>readiness, 0 to 100</span></div><div class="fig"><b>${hs}/${hi}</b><span>${BPR?'high-relevance topics':'topics'} started (${pct(hs,hi)}%)</span></div><div class="fig"><b>${n}</b><span>board questions answered</span></div><div class="fig"><b>${n?pct(c,n)+'%':'—'}</b><span>correct</span></div></div>
   <p class="tiny muted">Readiness is your mastery of each topic, weighted by ${BPR?'its blueprint relevance and by ':''}its category's share of the exam. Untouched topics count as zero, so it starts low and climbs as you cover ground.</p>
   <div class="row"><label class="f" style="max-width:220px">Target exam date<input type="date" id="examdate" value="${esc(st.prefs.examDate)}" style="background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px"></label>${days!=null&&days>0?`<span class="small muted">About ${Math.round(days/7)} weeks out · ${hi-hs} ${BPR?'high-relevance ':''}topics still to start. A guide for the plan, not a deadline: go at your own pace.</span>`:''}</div></div>
  ${vPlan()}
  ${busy()}${S.busy?'':`<div class="card"><h2>Board session</h2><div class="plain"><span class="eyebrow">How much today</span>${segBtns('commit',Object.entries(COMMIT).map(([k,v])=>[k,v.name+' · '+v.min+' min']),st.prefs.commit)}</div>
   ${modeRow()}<div class="plain"><span class="eyebrow">Up next from the blueprint</span>${pl.slice(0,cm.lessons).map(r=>`<div><b>${esc(r.t.name)}</b><div class="tiny muted">${esc(r.t.sec.name)} · ${r.t.sec.pct}% of the exam · ${esc(r.why)}</div></div>`).join('')}</div>
   <div class="row"><button class="btn pri" data-act="session" data-sc="abim">${st.prefs.auto?'Listen to':'Read'} a ${cm.min}-minute board session</button><button class="btn" data-act="mixed" data-sc="abim">Board question set (${st.prefs.qn||st.prefs.setSize||5}, level ${qD()})</button><button class="btn" data-act="cboards">Board flashcards</button></div></div>`}
  <div class="card"><h3>By content category</h3><div class="tablewrap"><table><thead><tr><th>Category</th><th class="n">Exam</th><th class="n">${BPR?'High started':'Started'}</th><th class="n">Questions</th><th class="n">Correct</th><th class="n">Ready</th></tr></thead><tbody>
   ${rows.sort((p,q)=>q.s.pct-p.s.pct).map(r=>`<tr><td><button class="btn link" data-sec="${r.s.id}" style="padding:0;text-align:left;white-space:normal">${esc(r.s.name)}</button></td><td class="n">${r.s.pct}%</td><td class="n">${r.y.hs}/${r.y.hi}</td><td class="n">${r.x.n}</td><td class="n">${r.x.n?pct(r.x.c,r.x.n)+'%':'—'}</td><td class="n">${Math.round(r.y.ready)}</td></tr>`).join('')}</tbody></table></div>
   <p class="tiny muted">${BPR?'High relevance: very likely to appear. Medium: moderately likely. Low: will not appear, so it is left out of the plan. Low frequency topics are capped by the ABIM at a small share of questions.':'This blueprint lists what can be tested and the share of the exam for each category and subsection. It does not rate topics by relevance, so every topic counts, weighted by those shares.'}</p>
   </div>${bpCard()}`}
function examCard(){const k=bpKind(),opts=[['cert','Cert: boards'],['moc','Recert: MOC or LKA']];if(bpOwn())opts.push(['own','My uploaded blueprint']);
  return `<div class="card"><h3>Which exam are you preparing for?</h3>${segBtns('bpKind',opts,k)}<p class="small muted">${k==='cert'?'The first-time ABIM Certification exam. Its blueprint lists every examinable topic with the share of the exam for each category and subsection. It gives no relevance ratings, so every topic counts.':k==='moc'?'The 10-year Maintenance of Certification exam and the Longitudinal Knowledge Assessment. Its blueprint rates every topic high, medium or low for each task, and topics rated low are left out.':'The blueprint you uploaded: '+esc(bpDoc().title||'')+'.'}</p>
   <span class="tiny muted">Sessions, questions, cards and the learning plan on this tab follow the exam you pick. Your record carries across: a topic with the same name in both blueprints keeps its progress.</span></div>`}
function bpCard(){const b=bpDoc(),own=bpOwn(),n=b.cats.reduce((k,c)=>k+c.topics.length,0);
  return `<div class="card"><h3>Blueprint</h3><p class="small muted">In use: <b>${esc(b.title||'ABIM blueprint')}</b>, ${n} topics in ${b.cats.length} categories. ${bpKind()==='own'?'This is the one you '+(b.how==='file'?'uploaded':'loaded')+(b.t?' on '+new Date(b.t).toLocaleDateString():'')+'; it is kept in your record.':'Both the Certification and the recertification blueprints come with the app, so there is nothing to set up.'}</p>
   ${S.busy?'':`<label class="f">Upload a newer or different blueprint<input type="file" id="bpfile" accept="application/pdf,.pdf,.txt,.md,.json,application/json,text/plain" style="padding:8px 0"></label>
   <span class="tiny muted">Use the blueprint PDF as downloaded from the ABIM website. Either ABIM layout reads: the Certification outline or the rated recertification one. It is added as a third choice above.</span>
   ${MCP?`<label class="f">Or load it from Google Drive: document title contains<input type="text" id="bpname" value="${esc(st.prefs.bpName)}"></label><div class="row"><button class="btn sm" data-act="bpload">Load from Google Drive</button></div>`:''}
   ${own?'<div class="row"><button class="btn sm" data-act="bpreset">Remove my uploaded blueprint</button></div>':''}
   <span class="tiny muted">Your study record is kept when the blueprint changes. Progress follows each topic by name, so a topic the new edition renames starts fresh.</span>`}</div>`}

/* ----- History: everything studied, to reopen, re-test or take further ----- */
function vHistory(){const f=S.hf||'all',all=st.lessons.slice().reverse(),keys=[...new Set(all.map(l=>TOP[l.tid]&&secDisc(TOP[l.tid].sec)).filter(Boolean))],list=all.filter(l=>TOP[l.tid]&&(f==='all'||secDisc(TOP[l.tid].sec)===f||(f==='done'&&l.done)||(f==='open'&&!l.done)));
  const cs=cardStat(),ct={};allCards().forEach(c=>{const x=ct[c.tid]||(ct[c.tid]={n:0,due:0});x.n++;if(c.n&&c.due<=Date.now())x.due++});const decks=Object.keys(ct).filter(id=>TOP[id]).sort((a,b)=>ct[b].due-ct[a].due||ct[b].n-ct[a].n);
  return `<div class="plain"><h1>History</h1><p class="small muted">Every lesson you have generated, newest first. Open one to read or listen again or dig deeper, or use its Questions menu to be tested on it: pick 5 to 30, or a custom number up to 30. Questions are written and fact-checked separately from the lesson, a few at a time.</p></div>${busy()}
  ${backupCard()}
   ${all.length?`<label class="f" style="max-width:320px">Show<select id="hfilter"><option value="all">All lessons (${all.length})</option><option value="done" ${f==='done'?'selected':''}>Completed</option><option value="open" ${f==='open'?'selected':''}>Not yet completed</option>${keys.map(k=>`<option value="${k}" ${f===k?'selected':''}>${esc(discName(k))}</option>`).join('')}</select></label>`:''}
  <div class="card" style="gap:0"><h3>Lessons</h3>${list.length?list.map(l=>{const qs=allQs().filter(q=>q.les===l.id||q.from===l.id),n=qs.reduce((a,q)=>a+q.hist.length,0),c=qs.reduce((a,q)=>a+q.hist.filter(h=>h.ok).length,0);return `<div class="item" style="cursor:default;flex-wrap:wrap"><button data-les="${l.id}" style="flex:1 1 220px;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit;cursor:pointer"><div><b>${esc(l.title)}</b><div class="tiny muted">${esc(TOP[l.tid].sec.name)} · ${l.min||LEN[l.len].min} min · ${new Date(l.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}${n?` · ${c}/${n} on its questions`:''}</div></div><span class="row" style="flex-wrap:nowrap">${l.deeper?'<span class="chip warn">Deeper</span>':''}<span class="chip ${l.done?'good':'off'}">${l.done?'Completed':'Open'}</span></span></button>${S.hq===l.id?`<span class="row" style="flex-wrap:nowrap"><input type="number" id="hqn" min="1" max="30" inputmode="numeric" value="${clampN(st.prefs.qn,1,30,10)}" aria-label="How many questions, up to 30" style="width:70px;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:5px 8px"><button class="btn sm pri" data-act="hisq" data-id="${l.id}">Write</button><button class="btn sm" data-act="hqx">Cancel</button></span>`:`<select data-hq="${l.id}" aria-label="Write questions on this lesson" ${S.busy||!SAMPLE?'disabled':''} style="width:auto;flex:none;padding:5px 8px;font-size:.85rem;font-weight:600"><option value="">Questions…</option>${[5,10,15,20,30].map(n=>`<option value="${n}">${n} questions</option>`).join('')}<option value="c">Custom number…</option></select>`}</div>`}).join(''):`<p class="small muted" style="padding-top:8px">${all.length?'Nothing matches that filter.':'No lessons yet. Start a session on the Today tab and it will appear here.'}</p>`}</div>
  <div class="card" style="gap:0"><h3>Flashcard decks</h3>${decks.length?decks.map(id=>{const x=cs[id];return `<button class="item" data-deck="${id}"><div><b>${esc(TOP[id].name)}</b><div class="tiny muted">${esc(TOP[id].sec.name)} · ${ct[id].n} cards${x&&x.k?' · average confidence '+(x.sum/x.k).toFixed(1)+' of 5':''}</div></div><span class="chip ${ct[id].due?'warn':'off'}">${ct[id].due?ct[id].due+' due':'Review'}</span></button>`}).join(''):'<p class="small muted" style="padding-top:8px">Cards appear here by topic once a lesson or a card request has written some.</p>'}</div>
  ${st.sets.length?`<div class="card"><h3>Question sets</h3><div class="tablewrap"><table><thead><tr><th>Set</th><th class="n">Correct</th><th class="n">%</th><th>Date</th></tr></thead><tbody>${st.sets.slice(-15).reverse().map(x=>`<tr><td style="white-space:normal">${esc(x.title)}</td><td class="n">${x.c}/${x.n}</td><td class="n">${pct(x.c,x.n)}</td><td>${new Date(x.t).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</td></tr>`).join('')}</tbody></table></div></div>`:''}`}

/* ----- Curriculum ----- */
function vLearn(){
  if(S.topic)return vTopic(TOP[S.topic]);
  if(S.sec){const s=SEC[S.sec],x=secStats(s);return `<div class="row"><button class="btn link" data-act="up">← ${esc(s.track.name)}</button></div><div class="plain"><h1>${esc(s.name)}</h1><p class="small muted">Sources: ${esc(s.src)} · ${s.pct?s.pct+'% of the exam · ':''}${x.started}/${x.total} topics started${x.n?` · ${pct(x.c,x.n)}% correct on ${x.n} questions`:''}</p></div>
    <div class="card" style="gap:0">${(()=>{let last='';return s.t.map(t=>{const m=mastery(t.id),[l,c]=level(m),head=t.bp&&t.bp.sub!==last?`<div class="eyebrow" style="padding-top:14px">${esc(last=t.bp.sub)}</div>`:'';return head+`<button class="item" data-topic="${t.id}"><div><b>${esc(t.name)}</b>${t.inp?' <span class="tiny muted">hospital</span>':''}${t.bp&&t.bp.r?` <span class="chip ${rel(t)==='H'?'':'off'}">${{H:'High',M:'Medium',L:'Not tested'}[rel(t)]}</span>${t.bp.lf?' <span class="tiny muted">low frequency</span>':''}`:''}</div><span class="row" style="flex-wrap:nowrap">${overconfident(t.id)?'<span class="chip bad">Check calibration</span>':''}<span class="chip ${c}">${l}${m!=null?' · '+m:''}</span></span></button>`}).join('')})()}</div>`}
  if(S.track){const tr=TRACKS.find(t=>t.id===S.track);return `<div class="row"><button class="btn link" data-act="up">← All tracks</button></div><div class="plain"><h1>${esc(tr.name)}</h1><p class="small muted">${esc(tr.blurb)}</p></div>
    <div class="card" style="gap:0">${tr.sections.map(s=>{const x=secStats(s);return `<button class="item" data-sec="${s.id}"><div><b>${esc(s.name)}</b><div class="tiny muted">${x.started}/${x.total} topics started${x.n?` · ${pct(x.c,x.n)}% correct`:''}</div></div><span class="row" style="flex-wrap:nowrap;min-width:110px"><span class="meter"><i style="width:${pct(x.started,x.total)}%"></i></span><span class="tiny num muted">${pct(x.started,x.total)}%</span></span></button>`}).join('')}</div>`}
  const recent=st.lessons.slice(-6).reverse();
  return `<div class="plain"><h1>Curriculum</h1><p class="small muted">Structured by discipline. Every lesson can be listened to or read, and ends with questions that feed your mastery record.</p></div>
  <div class="card" style="gap:0">${TRACKS.map(tr=>{let a=0,b=0;tr.sections.forEach(s=>{const x=secStats(s);a+=x.started;b+=x.total});return `<button class="item" data-track="${tr.id}"><div><b>${esc(tr.name)}</b><div class="tiny muted">${esc(tr.blurb)} · ${tr.sections.length} sections</div></div><span class="row" style="flex-wrap:nowrap;min-width:110px"><span class="meter"><i style="width:${pct(a,b)}%"></i></span><span class="tiny num muted">${pct(a,b)}%</span></span></button>`}).join('')}</div>

/* ----- A lesson: text on screen, audio in the transport ----- */
const lessonGist=L=>`"${L.title}". Its sections: ${L.segs.map(x=>x.h).filter(Boolean).join('; ')}. Its key points: ${L.pts.join(' ')}`;
const basisC=L=>`These cards follow a lesson the physician has just studied: ${lessonGist(L)}\nTake every card from what that lesson taught, on its highest-yield facts, and keep each one consistent with it.`;
const basisQ=L=>`These questions follow a lesson the physician has studied: ${lessonGist(L)}\nTest whether what that lesson taught can be applied to new patients. Every question must rest on something the lesson covered, in a case the lesson did not use.`;
const basisDeep=L=>`This is a "dig deeper" follow-up to a lesson the physician has already completed: ${lessonGist(L)}\nDo not re-teach those points; assume them. Go further: the mechanism behind the recommendation, the exceptions and special populations, the harder and atypical cases, the trials the guidance rests on and where the evidence is thin, and what a subspecialist would add. Title it so it is clearly the next level on the same subject.`;
const basisDeepQ=L=>`These are "dig deeper" questions following a lesson the physician has completed: ${lessonGist(L)}\nGo beyond what that lesson stated outright: exceptions, special populations, complications of treatment, and what to do when first-line management fails.`;
function lessonQueue(L,withQs){const q=[{say:L.title+'.',seg:0}];L.segs.forEach((s,i)=>{if(s.h)q.push({say:s.h+'.',seg:i});q.push({say:s.x,seg:i});if(s.f)q.push({say:'A note of caution. '+s.f,seg:i});q.push({wait:500,seg:i})});
  if(L.pts.length)q.push({say:'Key points. '+L.pts.join(' '),seg:'pts'});
  if(L.unc&&L.unc.length)q.push({say:'Before you rely on this lesson, verify the following. '+L.unc.join(' '),seg:'unc'});
  if(withQs)L.qids.map(findQ).filter(Boolean).forEach((x,n)=>{q.push({say:`Question ${n+1}. ${x.stem} `+x.opts.map((o,i)=>'ABCDE'[i]+'. '+o+'.').join(' '),seg:'q'+n});q.push({wait:7000,seg:'q'+n});q.push({say:`The answer is ${'ABCDE'[x.ans]}. ${x.opts[x.ans]}. ${x.exp}${x.cav?' A note of caution. '+x.cav:''}`,seg:'q'+n})});return q}

  <div class="lesson">${L.segs.map((x,i)=>`<section data-seg="${i}">${x.h?`<h3>${esc(x.h)}</h3>`:''}${x.x.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}${figHTML(x.fig,L.ref)}${tableHTML(x.tb)}${x.fx?`<p class="tiny muted" style="font-family:var(--ui)">Corrected at review: ${esc(x.fx)}</p>`:''}${x.f?`<p class="caveat"><b>Uncertain.</b> ${esc(x.f)}${x.f.length===400&&!/[.!?…]$/.test(x.f)?'…':''}</p>`:''}</section>`).join('')}</div>

const rateRow=(tid,cur)=>`<div class="rate">${[[1,'New to me'],[2,'Shaky'],[3,'Getting there'],[4,'Solid'],[5,'Could teach it']].map(([v,l])=>`<button data-rate="${v}" data-tid="${tid}" aria-pressed="${cur===v}"><b>${v}</b>${l}</button>`).join('')}</div>`;

/* Scoring one answer: the topic, the day, the stated gap and the question's own review schedule all update. A miss comes back in 1, 3, 7 and 21 days. */
function score(q,pick){const ok=pick===q.ans,s=tS(q.tid),d=day();q.hist.push({t:Date.now(),ok});s.n++;d.q++;if(ok){s.c++;d.c++}s.last=Date.now();
  if(!ok){q.stage=1;q.due=Date.now()+864e5;pullCards(q.tid,1)}else if(q.stage){q.stage++;q.due=q.stage>4?0:Date.now()+[0,1,3,7,21][q.stage]*864e5}
  const g=q.gap&&st.gaps.find(x=>x.id===q.gap);if(g){g.n=(g.n||0)+1;if(ok)g.c=(g.c||0)+1}
  saveBank(TOP[q.tid].sec.id);saveState();return ok}

  ${(()=>{const d=ite();return `<div class="card"><h3>In-training exam report</h3>${d?`<p class="small"><b>${esc(d.exam)}${d.year?' '+esc(d.year):''}</b>${d.overall!=null?' · '+d.overall+'% correct':''}${d.pctile!=null?' · percentile '+d.pctile:''} · ${d.missed.length} missed objectives, ${d.missed.filter(x=>TOP[x.tid]).length} matched to topics</p>

function recordSummary(){return recordCore()+'\nBy discipline, against their own average:\n'+landText()}
function recordCore(){const rows=[];TRACKS.forEach(tr=>tr.sections.forEach(s=>{const x=secStats(s);if(x.n||x.started)rows.push(`${s.name}: ${x.started}/${x.total} topics started, ${x.n} questions, ${x.n?pct(x.c,x.n):0}% correct, mastery ${x.m??'n/a'}`)}));
  const w=span(7),weak=Object.values(TOP).map(t=>({t,m:mastery(t.id)})).filter(x=>x.m!=null).sort((a,b)=>a.m-b.m).slice(0,8).map(x=>`${x.t.name} (${x.m}; ${st.topics[x.t.id].c}/${st.topics[x.t.id].n}; self-rating ${st.topics[x.t.id].rate||'none'})`);
  return `Streak ${streak()} days; ${w.act}/7 days active in the last week; ${Math.round(w.min)} minutes in the last 7 days; ${dueQs().length} missed questions due for review.\nSections with activity:\n${rows.join('\n')||'none yet'}\nWeakest topics: ${weak.join('; ')||'none yet'}\nConfidence ahead of accuracy: ${Object.values(TOP).filter(t=>overconfident(t.id)).map(t=>t.name).join('; ')||'none'}\nStated gaps still open: ${st.gaps.filter(g=>!g.done).map(g=>g.text).join('; ')||'none'}\nSections never touched: ${Object.values(SEC).filter(s=>!secStats(s).started).map(s=>s.name).join('; ')||'none'}`}

async function run(label,fn){if(S.busy)return;S.busy=label;S.err='';render();try{await fn()}catch(e){S.err=errMsg(e);console.error(e)}S.busy='';render()}

  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);ok()}catch(e){toast('The backup could not be saved here.',6000)}}
function readBackup(text){let j;try{j=JSON.parse(text)}catch(e){return {err:'That file is not a backup: it could not be read as JSON.'}}
  const src=j&&typeof j.docs==='object'&&j.docs?j.docs:null;if(!src||(j.app&&j.app!=='doctor-career-companion'))return {err:'That file is not a Doctor Career Companion backup.'};
  const out={};Object.entries(src).forEach(([k,v])=>{const n=k.startsWith(AREA+'/')?k.slice(AREA.length+1):k;if(/^[A-Za-z0-9_\-.~:@+]{1,120}$/.test(n)&&v&&typeof v==='object'&&!Array.isArray(v))out[n]=v});
  const n=Object.keys(out).length;return n?{n,saved:j.saved||'',state:!!(out.state&&out.state.v),docs:out}:{err:'That backup is empty.'}}
