<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Doctor Career Companion account</title>
<link rel="manifest" href="/manifest.json"><link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#f2f5f4;--card:#fff;--ink:#12242b;--muted:#55686f;--line:#d5dedc;--cobalt:#0d6e6a;--cobalt-ink:#fff;--cobalt-soft:#dcefec;--good:#1b7a4e;--good-soft:#dff2e7;--bad:#b23a2a;--bad-soft:#fae6e2;--note:#f8edd6;
  --es:"IBM Plex Serif",Georgia,serif;--ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#0c1517;--card:#142023;--ink:#e3ecea;--muted:#93a6a6;--line:#24363a;--cobalt:#5fc9bf;--cobalt-ink:#0c1517;--cobalt-soft:#16302f;--good:#55c591;--good-soft:#143021;--bad:#f0836f;--bad-soft:#3a1d18;--note:#2e2613;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui);padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--es);margin:0;line-height:1.2}
h1{font-size:1.7rem}h2{font-size:1.2rem}
p{margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}.small{font-size:.85rem}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600}
input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
input:focus-visible,.btn:focus-visible,a:focus-visible{outline:2px solid var(--cobalt);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 15px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.pri{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.btn.link{border:0;background:none;color:var(--cobalt);padding:4px 0}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #747775;font-weight:600}
.gbtn svg{width:18px;height:18px;flex:none}
.check{flex-direction:row;align-items:center;gap:8px;font-weight:500}.check input{width:18px;height:18px;margin:0}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.8rem}.or::before,.or::after{content:'';flex:1;border-top:1px solid var(--line)}
.err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:9px 12px;font-size:.88rem}
.ok{background:var(--good-soft);color:var(--good);border-radius:9px;padding:9px 12px;font-size:.88rem}
.note{background:var(--note);border-radius:9px;padding:10px 12px;font-size:.88rem}
code{display:block;word-break:break-all;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:.82rem}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--cobalt-soft);color:var(--cobalt)}
.chip.on{background:var(--good-soft);color:var(--good)}
select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 9px;max-width:100%}
.tiers{display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--cobalt);padding-left:12px}
.tier{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.tier b{min-width:104px;font-size:.85rem}
td{vertical-align:top}
.jobs{display:flex;flex-direction:column}.job{display:flex;flex-direction:column;gap:3px;padding:10px 0;border-top:1px solid var(--line)}
textarea{font:inherit;font-size:.88rem;line-height:1.5;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:340px;width:100%;resize:vertical}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LANGS={med:'Study and career record'};
let me=null,mode='login',resetMode='direct',resetEmail=false,qlist=[],pwOpen=false,fg=null,fgEmail='',rqOpen=false,newLink='',msg='',confirmDel=false,backups=null,accounts=null,test=null,syncing=false;
const driveMsg=new URLSearchParams(location.search).get('drive')||'';
const when=t=>t?new Date(t).toLocaleString():'never';
const nextUrl=new URLSearchParams(location.search).has('next');
/* Sign in with Google (website only): the app's public client id, and a message the server sent back to this page (?gsi=). */
let gsi=null,oneTap=false;
const gsiMsg=new URLSearchParams(location.search).get('gsi')||'';
if(gsiMsg){try{const u=new URL(location.href);u.searchParams.delete('gsi');history.replaceState(null,'',u.pathname+u.search+u.hash)}catch(e){}}
const G_ICON='<svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
const resetTok=(new URLSearchParams(location.search).get('reset')||'').match(/^[a-f0-9]{64}$/)?.[0]||'';
async function api(method,path,body){const r=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'Something went wrong. Try again.');return j}
/* The standard account pieces (account standard, 2026-10-25), shared by sign-up and the setup screen: the security question and the
   optional demographics ("Prefer not to say" by default). */
const GEN=[['','Prefer not to say'],['woman','Woman'],['man','Man'],['nonbinary','Non-binary'],['self','Prefer to self-describe']];
const today=()=>new Date().toISOString().slice(0,10);
function demoFields(d){d=d||{};return `<div class="row"><label style="flex:1">Gender (optional)<select id="gender" name="gender">${GEN.map(([k,n])=>`<option value="${k}" ${(d.gender||'')===k?'selected':''}>${n}</option>`).join('')}</select></label>
   <label style="flex:1">Date of birth (optional)<input id="dob" name="bday" type="date" autocomplete="bday" min="1900-01-01" max="${today()}" value="${esc(d.dob||'')}"></label></div>
   <label id="gselfw" ${d.gender==='self'?'':'hidden'}>Gender in your own words<input id="gself" maxlength="60" autocomplete="off" value="${esc(d.genderSelf||'')}"></label>`}
function qFields(){return `<label>Security question<select id="sq" name="security-question" required><option value="">Choose a question</option>${qlist.map(q=>`<option>${esc(q)}</option>`).join('')}</select></label>
   <label>Answer<input id="sa" name="security-answer" autocomplete="off" autocapitalize="off" required></label>
   <span class="small muted">If you forget your password, you answer this to set a new one. Capitals, punctuation and extra spaces do not matter.</span>`}
const demoBody=()=>({gender:v('gender'),genderSelf:v('gself'),dob:v('dob')});
const pwPair=(auto)=>`<label>Password<input id="pw" name="password" type="password" autocomplete="${auto||'new-password'}" minlength="8" required></label>
   <label>Confirm password<input id="pw2" name="password-confirm" type="password" autocomplete="new-password" minlength="8" required></label><span class="small muted">At least 8 characters.</span>`;
function auth(){
  if(resetTok)return `<h1>Choose a new password</h1><div class="card"><label>New password<input id="pw" type="password" autocomplete="new-password" minlength="8"></label><label>Confirm new password<input id="pw2" type="password" autocomplete="new-password" minlength="8"></label>${msg}<div class="row"><button class="btn pri" data-act="reset">Save password</button></div></div>`;
  const su=mode==='signup',fgm=mode==='forgot';
  /* Forgot password (the standard way): the email, then the security question tied to it, then the new password and its confirmation.
     An account without a password yet sets one the same way. */
  if(fgm&&resetMode==='direct'){const pws=`<label>New password<input id="pw" type="password" autocomplete="new-password" minlength="8" required></label>
   <label>Confirm new password<input id="pw2" type="password" autocomplete="new-password" minlength="8" required></label>`,back='<div class="row small"><button class="btn link" data-act="fgback">Use a different email</button><button class="btn link" data-mode="login">Back to log in</button></div>';
   const title=fg&&fg.password===false?'Set a password':'Reset your password';
   return `<div><h1>Doctor Career Companion</h1></div><div class="card"><h2>${title}</h2>
   ${!fg?`<p class="small muted">Enter the email of your account. Your security question appears next.</p>
     <label>Email<input id="email" type="email" autocomplete="email"></label>${msg}
     <div class="row"><button class="btn pri" data-act="fgnext">Continue</button>${resetEmail?'<button class="btn" data-act="fgmail">Email me a reset link instead</button>':''}</div><div class="row small"><button class="btn link" data-mode="login">Back to log in</button></div>`
   :!fg.names?`<p class="small muted">${esc(fgEmail)}</p>
     <p><b>${esc(fg.question)}</b></p>
     <label>Your answer<input id="ra" autocomplete="off" autocapitalize="off" required></label>${pws}${msg}
     <div class="row"><button class="btn pri" data-act="direct">${esc(title)}</button></div>${back}`
   :`<p class="small muted">${esc(fgEmail)} has no security question yet. Enter the first and last name the account was created with instead; you will be asked to choose a question when you next log in.</p>
     <div class="row"><label style="flex:1">First name<input id="first" autocomplete="given-name"></label><label style="flex:1">Last name<input id="last" autocomplete="family-name"></label></div>${pws}${msg}
     <div class="row"><button class="btn pri" data-act="direct">Reset your password</button></div>${back}`}</div>`}
  if(fgm&&resetMode==='off')return `<div><h1>Doctor Career Companion</h1></div><div class="card"><h2>Reset your password</h2><p class="small muted">Password reset is switched off on this site. Ask the site owner to help.</p><div class="row small"><button class="btn link" data-mode="login">Back to log in</button></div></div>`;
  return `<div><h1>Doctor Career Companion</h1><p class="muted">Your account keeps your study record (question history, mastery by topic, lessons, career plans) whether you use the app here or inside Claude.</p></div>
  <form class="card" id="authf" data-act="${su?'signup':fgm?'forgot':'login'}" method="post" action="#" autocomplete="on" novalidate><h2>${su?'Create your account':fgm?'Reset your password':'Log in'}</h2>
   ${!fgm&&gsi&&gsi.redirect?`<a class="btn gbtn" href="/auth/google" data-gsi>${G_ICON}<span>${su?'Sign up with Google':'Sign in with Google'}</span></a><div class="or">or with ${su?'a password':'your password'}</div>`:''}
   ${su?`<div class="row"><label style="flex:1">First name<input id="first" name="given-name" autocomplete="given-name" required></label><label style="flex:1">Last name<input id="last" name="family-name" autocomplete="family-name" required></label></div>`:''}
   <label>${fgm?'Recovery email':'Email'}<input id="email" name="email" type="email" autocomplete="${su||fgm?'email':'username'}" required></label>
   ${su?pwPair()+qFields()+demoFields():fgm?'':`<label>Password<input id="pw" name="password" type="password" autocomplete="current-password"></label>`}
   ${fgm?'':'<label class="check"><input type="checkbox" id="stay" name="stay" checked> Stay logged in</label>'}
   ${su?'<span class="small muted">By creating an account you agree to the <a href="/terms.html">terms of service</a> and <a href="/privacy.html">privacy policy</a>.</span>':''}
   ${msg}
   <div class="row"><button class="btn pri" type="submit">${su?'Create account':fgm?'Email me a reset link':'Log in'}</button></div>
   <div class="row small">${su?'<button type="button" class="btn link" data-mode="login">I already have an account</button>':`<button type="button" class="btn link" data-mode="signup">Create an account</button>${fgm?'<button type="button" class="btn link" data-mode="login">Back to log in</button>':'<button type="button" class="btn link" data-mode="forgot">Forgot password?</button>'}`}</div></form>`}
/* Finish setting up your account: an account made by Google or Life OS (no password yet), or an older one without a last name or a
   security question, sees only this until it is complete. Only what is missing is asked; the email is fixed. */
function setupView(){const miss=(me.setup&&me.setup.missing)||[],full=me.password===false,names=full||miss.includes('first')||miss.includes('last');
  return `<div class="row" style="justify-content:space-between"><h1>Finish setting up your account</h1><button class="btn link" data-act="logout">Log out</button></div>
  <form class="card" id="setupf" data-act="setup" method="post" action="#" autocomplete="on" novalidate>
   <p class="small muted">${full?'One step before you start: choose a password and a security question, so you can always get back into your account.':'One more step: your account needs '+[miss.includes('first')&&'your first name',miss.includes('last')&&'your last name',miss.includes('question')&&'a security question'].filter(Boolean).join(' and ')+'.'}</p>
   <label>Email<input id="email" name="email" type="email" value="${esc(me.email)}" readonly autocomplete="username"></label>
   ${names?`<div class="row"><label style="flex:1">First name<input id="first" name="given-name" autocomplete="given-name" value="${esc(me.firstName||'')}" required></label><label style="flex:1">Last name<input id="last" name="family-name" autocomplete="family-name" value="${esc(me.lastName||'')}" required></label></div>`:''}
   ${full?demoFields(me):''}
   ${me.password===false?pwPair():''}
   ${miss.includes('question')?qFields():''}
   ${msg}
   <div class="row"><button class="btn pri" type="submit">Save and continue</button></div></form>`}
function home(){
  const langs=me.areas||[];
  return `<div class="row" style="justify-content:space-between"><h1>${esc(me.firstName?'Dr. '+(me.lastName||me.firstName):'Your account')}</h1><button class="btn link" data-act="logout">Log out</button></div>
  <div class="card"><h2>The app</h2><p class="small muted">Use it here in the browser, or inside Claude. Both read and save the same record.</p><div class="row"><a class="btn pri" href="/">Open the app</a></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Claude connector</h2><span class="chip ${me.connector?'on':''}">${me.connector?'On':'Not set up'}</span></div>
   ${newLink?`<div class="ok">Your new connector link. Copy it now; it is shown only once.</div><code id="lnk">${esc(newLink)}</code><div class="row"><button class="btn pri" data-act="copy">Copy link</button></div>
     <ol class="small"><li>In Claude, open <b>Settings → Connectors</b> and choose <b>Add custom connector</b>.</li><li>Name it <b>Doctor Companion App</b> and paste the link as the URL.</li><li>Set its tools to <b>Always allow</b>, except delete_doc: set that one to <b>Ask</b>.</li><li>Open the app in Claude and reload it. The header should say "Saved to your account".</li></ol>`
    :`<p class="small muted">${me.connector?'Your link was made on '+esc(new Date(me.connector).toLocaleDateString())+'. If you lost it or think someone else has it, make a new one; the old link stops working.':'The app inside Claude saves to this account through a private connector link. Make one, then add it in Claude.'}</p>
     <div class="row"><button class="btn pri" data-act="mklink">${me.connector?'Make a new link':'Make my connector link'}</button>${me.connector?'<button class="btn" data-act="offlink">Turn off</button>':''}</div>`}</div>
  <div class="card"><h2>Your record</h2>${langs.length?`<table><thead><tr><th>Area</th><th>Saved items</th><th>Last saved</th></tr></thead><tbody>${langs.map(l=>`<tr><td>${esc(LANGS[l.lang]||l.lang)}</td><td>${l.n}</td><td>${esc(new Date(l.updated).toLocaleString())}</td></tr>`).join('')}</tbody></table>`:'<p class="small muted">Nothing saved yet. Your record appears here after your first session.</p>'}
   <div class="row"><a class="btn" href="/api/backup">Download a backup</a></div></div>
  ${recovery()}${store()}${ais()}${me.admin?adminHead()+owner()+labour()+legal()+'<section class="card" id="usap-gov" data-usap-governance hidden></section>':''}
  ${msg}
  <div class="card"><h2>Account</h2><p class="small muted">${esc(me.email)} · recovery email</p>
   ${me.password===false?`<p class="small muted">You sign in with Google${me.google?'':' or through Life OS'}; your account has no password. ${pwOpen?'Choose one to also log in with your email and password.':'You can set one to log in with your email too.'}</p>`:''}
   ${pwOpen?`${me.password===false?'':'<label>Current password<input id="cur" type="password" autocomplete="current-password"></label>'}
    <label>New password<input id="pw" type="password" autocomplete="new-password" minlength="8"></label>
    <label>New password again<input id="pw2" type="password" autocomplete="new-password" minlength="8"></label>
    <span class="small muted">At least 8 characters. Other devices logged in to this account are logged out; this one stays in.</span>
    <div class="row"><button class="btn pri" data-act="pwsave">Save new password</button><button class="btn" data-act="pwclose">Cancel</button></div>`:`<div class="row"><button class="btn" data-act="pwopen">${me.password===false?'Set a password':'Change password'}</button></div>`}
   <div class="row">${confirmDel?'<button class="btn danger" data-act="delacct">Yes, delete my account and everything saved</button><button class="btn" data-act="nodel">Keep it</button>':'<button class="btn danger" data-act="askdel">Delete account</button>'}</div></div>`}
/* The recovery questions this account answers to replace a forgotten password: up to three, each chosen from the site's list. */
function recovery(){const have=me.recovery||[],list=me.questions||[];if(!list.length)return '';
  const pick=i=>`<label>Question ${i+1}${i?' (optional)':''}<select id="rq${i}"><option value="">${i?'None':'Choose a question'}</option>${list.map(q=>`<option ${have[i]===q?'selected':''}>${esc(q)}</option>`).join('')}</select></label>
    <label>Answer ${i+1}<input id="ra${i}" autocomplete="off" autocapitalize="off" placeholder="${have[i]?'Leave blank to keep your saved answer':''}"></label>`;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Recovery questions</h2><span class="chip ${have.length?'on':''}">${have.length?have.length+' set':'Not set'}</span></div>
   <p class="small muted">If you forget your password, "Forgot password?" on the log in screen asks you to pick one of these and answer it. Capitals, punctuation and extra spaces do not matter.</p>
   ${rqOpen?`${[0,1,2].map(pick).join('')}${me.password===false?'':'<label>Current password<input id="rcur" type="password" autocomplete="current-password"></label>'}
     <div class="row"><button class="btn pri" data-act="rqsave">Save recovery questions</button><button class="btn" data-act="rqclose">Cancel</button></div>`
   :`${have.length?`<ol class="small">${have.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>`:'<div class="note">You have none yet. Until you set one, your password can be replaced by anyone who knows your email and name.</div>'}
     <div class="row"><button class="btn ${have.length?'':'pri'}" data-act="rqopen">${have.length?'Change recovery questions':'Set recovery questions'}</button></div>`}</div>`}
/* This account's own folder in Google Drive: how much of the record is there, and its dated backups. */
function store(){const s=me.storage||{};if(!s.on)return me.owner?'':`<div class="card"><h2>Central storage</h2><p class="small muted">Your record is saved in this site's database. The copy in Google Drive is not switched on yet.</p></div>`;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Central storage</h2><span class="chip ${s.waiting||s.error?'':'on'}">${s.error?'Problem':s.waiting?s.waiting+' waiting':'Up to date'}</span></div>
   <p class="small muted">Every record is also kept in a private folder for your account in the app's Google Drive storage, labelled with a random code and not your name or email, with a dated backup for each day you study. Only your account can read or change it through this site.</p>
   <table><tbody><tr><td>Records in Drive</td><td>${s.records-s.waiting} of ${s.records}</td></tr><tr><td>Last copied</td><td>${esc(when(s.synced))}</td></tr><tr><td>Latest backup</td><td>${esc(s.backupDay||'none yet')}</td></tr></tbody></table>
   ${s.error?`<div class="err">${esc(s.error)}</div>`:''}
   <div class="row"><button class="btn" data-act="sync" ${syncing?'disabled':''}>${syncing?'Copying…':'Copy to Drive now'}</button><button class="btn" data-act="backups">${backups?'Refresh backups':'Show backups'}</button>${s.url?`<a class="btn" href="${esc(s.url)}" target="_blank" rel="noopener">Open my folder</a>`:''}</div>
   ${backups?(backups.length?`<table><thead><tr><th>Backup</th><th>Size</th><th></th></tr></thead><tbody>${backups.map(b=>`<tr><td>${esc(b.name.replace(/^backup-|\.json$/g,''))}</td><td>${Math.max(1,Math.round(b.size/1024))} KB</td><td><a href="/api/storage/backup?id=${encodeURIComponent(b.id)}">Download</a></td></tr>`).join('')}</tbody></table><p class="small muted">To go back to one, download it, then use Restore on the History tab of the app.</p>`:'<p class="small muted">No backups yet. The first is written after your first session.</p>'):''}</div>`}
function ais(){const p=me.providers||[];if(!p.length)return '';return `<div class="card"><h2>AI on the website</h2><p class="small muted">Pick which one answers in the app, under Settings or in the Ask panel. When one runs out for the day, the next takes over.</p>
   <table><thead><tr><th>Service</th><th>Left today</th></tr></thead><tbody>${p.map(a=>`<tr><td>${esc(a.name)}</td><td>${a.left} of ${a.cap}</td></tr>`).join('')}</tbody></table></div>`}
/* Admin sections: only USAP admins see them (the owner, and people the owner granted a USAP Control Center role after they
   signed up at USAP; the server asks USAP). The owner and USAP developers may change the Google Drive connection; other admins
   see it. AI tiers and the legal pages stay the owner's to change; other admins see them and the accounts list masked. */
const ROLE_NAME={owner:'Owner',administrator:'Administrator',developer:'Developer',auditor:'Auditor',custom:'Custom'};
function adminHead(){const r=me.admin||{};return `<div class="row" style="justify-content:space-between;margin-top:8px"><h2>Admin</h2><span class="chip on">${esc(ROLE_NAME[r.role]||r.role||'Admin')}</span></div>
   <p class="small muted">Only USAP admins see this part of the page.${me.owner?'':' You can see everything below; changes to the Google Drive connection need the owner or a USAP developer, and AI tiers and the legal pages stay with the owner.'}</p>`}
function owner(){const d=me.drive||{},ed=d.canEdit!==false;const line=(n,o)=>`<tr><td>${n}</td><td>${o.ok?esc(o.name)+(o.write===false?' · cannot write':o.write?' · can write':' · can read'):'Not reachable'}${o.error?`<br><span class="small muted">${esc(o.error)}</span>`:''}</td></tr>`;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2>Google Drive</h2><span class="chip ${d.mode==='oauth'?'on':''}">${d.mode==='oauth'?'Connected':d.mode==='service'?'Read only':'Not connected'}</span></div>
   ${driveMsg&&driveMsg!=='ok'?`<div class="err">${esc(driveMsg)}</div>`:driveMsg==='ok'?'<div class="ok">Google Drive is connected. Press Test to check both folders.</div>':''}
   <p class="small muted">${d.mode==='oauth'?'Connected as '+esc(d.account||'your Google account')+'. The server reads the knowledge folder and writes one folder per account in the accounts folder, and touches nothing else.':d.mode==='service'?'Using the service account '+esc(d.account)+'. It can read the library, but Google does not let a service account keep files in a personal Drive, so account folders need your own Google account connected.':'Connect your Google account so the server can read the knowledge folder and write account folders.'}</p>
   ${d.canConnect||!ed?'':`<div class="note">Add the GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET secrets in Cloudflare first. The redirect address to give Google is:<code>${esc(d.redirect)}</code></div>`}
   ${ed?'':'<p class="small muted">You can see this connection; only the owner and USAP developers can connect, test or disconnect it.</p>'}
   <div class="row">${ed&&d.canConnect?`<a class="btn pri" href="/api/google/connect">${d.mode==='oauth'?'Reconnect Google Drive':'Connect Google Drive'}</a>`:''}${ed&&d.mode?'<button class="btn" data-act="gtest">Test</button>':''}${ed&&d.mode==='oauth'?'<button class="btn" data-act="goff">Disconnect</button>':''}<button class="btn" data-act="accts">${accounts?'Refresh accounts':'Show accounts'}</button></div>
   ${test?`<table><tbody>${line('Knowledge folder',test.knowledge)}${line('Accounts folder',test.accounts)}</tbody></table>`:''}
   ${accounts?`<div style="overflow-x:auto"><table><thead><tr><th>Account</th><th>In Drive</th><th>Last copied</th><th></th></tr></thead><tbody>${accounts.map(a=>`<tr><td>${esc([a.first,a.last].filter(Boolean).join(' '))}${a.first||a.last?'<br>':''}<span class="small muted">${esc(a.email)}</span></td><td>${a.inDrive} of ${a.records}${a.error?'<br><span class="small" style="color:var(--bad)">'+esc(a.error)+'</span>':''}</td><td>${esc(when(a.synced))}</td><td>${a.folder?`<a href="${esc(a.folder)}" target="_blank" rel="noopener">Folder</a>`:''}</td></tr>`).join('')}</tbody></table></div>`:''}</div>`}
/* The owner's picture of the division of labour, and the two things that can be changed: a service's tier, and the lowest tier a job allows. */
const TN={lead:'Lead teacher',assistant:'Assistant',chat:'Chat only'};
function labour(){const h=me.hierarchy;if(!h)return '';const sel=(kind,id,cur)=>`<select data-h="${kind}" data-id="${esc(id)}" aria-label="Tier" ${me.owner?'':'disabled'}>${h.tiers.map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${esc(t.name)}</option>`).join('')}</select>`;
  return `<div class="card"><h2>AI: who does what</h2><p class="small muted">Each AI service sits in a tier, and each job names the lowest tier allowed to do it. A service can do any job at or below its own tier. ${me.owner?'Changes apply to every account at once.':'Only the owner changes this.'}</p>
   <div class="tiers">${h.tiers.map(t=>{const l=h.services.filter(s=>s.tier===t.id);return `<div class="tier"><b>${esc(t.name)}</b><span>${l.length?l.map(s=>`<span class="chip ${s.on?'on':''}" title="${s.on?'Key is set':'No key set'}">${esc(s.name)}${s.on?'':' · no key'}</span>`).join(' '):'<span class="small muted">nobody</span>'}</span></div>`}).join('')}</div>
   <table><thead><tr><th>Service</th><th>Tier</th></tr></thead><tbody>${h.services.map(s=>`<tr><td>${esc(s.name)}${s.on?'':' <span class="small muted">(no key set)</span>'}</td><td>${sel('tiers',s.id,s.tier)}</td></tr>`).join('')}</tbody></table>
   <div class="jobs">${h.jobs.map(j=>`<div class="job"><div class="row" style="justify-content:space-between"><b>${esc(j.name)}</b>${sel('jobs',j.id,j.need)}</div><span class="small muted">${esc(j.what)}</span>
     <span class="small">${j.order.length?'Done by '+esc(j.order.join(', then ')):'<span style="color:var(--bad)">Nobody can do this: add a key or lower the tier</span>'}${j.differ?'. Never the one that wrote it, when another is available':''}${j.pick&&j.id!=='chat'?'. The user\'s "Teaching by" choice goes first':''}.</span></div>`).join('')}</div>
   ${me.owner?'<div class="row"><button class="btn" data-act="hreset">Back to the built-in defaults</button></div>':''}</div>`}
document.addEventListener('change',e=>{if(e.target.id==='gender'){const w=$('#gselfw');if(w)w.hidden=e.target.value!=='self'}});
document.addEventListener('change',async e=>{const d=e.target.dataset||{};if(!d.h)return;try{me.hierarchy=await api('PUT','/api/admin/hierarchy',{[d.h]:{[d.id]:e.target.value}});msg='';draw()}catch(x){show(x.message)}});
/* The owner rewrites the privacy policy and the terms of service here. */
let doc=null;
function legal(){if(!me.owner)return `<div class="card"><h2>Privacy policy and terms</h2><p class="small muted">Only the owner rewrites these pages.</p><div class="row"><a class="btn" href="/privacy.html" target="_blank" rel="noopener">Privacy policy</a><a class="btn" href="/terms.html" target="_blank" rel="noopener">Terms of service</a></div></div>`;
  return `<div class="card"><h2>Privacy policy and terms</h2><p class="small muted">Both pages are plain text you can rewrite. A saved change is live within a few minutes and stamps the page with today's date.</p>
   <div class="row"><button class="btn" data-act="doc" data-name="privacy">Edit privacy policy</button><button class="btn" data-act="doc" data-name="terms">Edit terms of service</button></div>
   ${doc?`<label>${esc(doc.title)} ${doc.custom?'(your edited version, '+esc(doc.date)+')':'(built-in wording)'}<textarea id="doctext" spellcheck="true">${esc(doc.text)}</textarea></label>
    <p class="small muted">Start a section with <b>## Heading</b>. Start a bullet with <b>- </b>. Leave a blank line between paragraphs. <b>**bold**</b> makes bold; <b>[words](https://address)</b> makes a link.</p>
    <div class="row"><button class="btn pri" data-act="docsave">Save and publish</button><a class="btn" href="/${doc.name}.html" target="_blank" rel="noopener">View the page</a>${doc.custom?'<button class="btn" data-act="docreset">Back to the built-in wording</button>':''}<button class="btn link" data-act="docclose">Close</button></div>`:''}</div>`}
async function syncAll(){if(syncing)return;syncing=true;draw();try{for(let i=0;i<40;i++){const s=await api('POST','/api/storage/sync');me.storage=s;draw();if(!s.waiting||s.error)break}}catch(e){}syncing=false;draw()}
/* Settings > Governance for USAP admins: the shared renderer (/usap/ui.js) draws it; USAP decides what it shows. */
let govUi=null;
function mountGov(){const el=$('#usap-gov');if(!el)return;govUi=govUi||new Promise((ok,no)=>{const x=document.createElement('script');x.src='/usap/ui.js';x.onload=ok;x.onerror=no;document.head.appendChild(x)});
  govUi.then(()=>{if(window.UsapGovernance&&document.body.contains(el))Promise.resolve(window.UsapGovernance.mount(el)).then(r=>{el.hidden=!(r&&r.visible)}).catch(()=>{})}).catch(()=>{})}
function draw(){$('#app').innerHTML=(me?(me.setup&&me.setup.complete===false?setupView():home()):auth())+'<p class="small muted" style="text-align:center"><a href="/privacy.html" style="color:inherit">Privacy policy</a> · <a href="/terms.html" style="color:inherit">Terms of service</a></p>';mountGov();startOneTap()}
/* One Tap: only on the log in and sign-up screens, only signed out, only when this page is not in a frame, and only when the site has a
   Google client. Google's script verifies nothing here: the credential goes to the server, which checks it against Google's keys. */
function startOneTap(){if(oneTap||me||!gsi||!gsi.google||!gsi.client_id||resetTok||(mode!=='login'&&mode!=='signup'))return;try{if(window.top!==window)return}catch(e){return}
  oneTap=true;const x=document.createElement('script');x.src='https://accounts.google.com/gsi/client';x.async=true;x.onload=()=>{try{google.accounts.id.initialize({client_id:gsi.client_id,callback:oneTapDone,auto_select:false,cancel_on_tap_outside:true,use_fedcm_for_prompt:true,itp_support:true});google.accounts.id.prompt()}catch(e){}};document.head.appendChild(x)}
async function oneTapDone(r){try{await api('POST','/auth/google/onetap',{credential:r&&r.credential,stay:!$('#stay')||$('#stay').checked});if(nextUrl)return location.replace('/');location.replace('/account.html')}catch(x){show(x.message)}}
const v=id=>($('#'+id)||{}).value||'';
const show=(t,ok)=>{msg=`<div class="${ok?'ok':'err'}">${esc(t)}</div>`;draw()};
const stayOn=()=>!$('#stay')||$('#stay').checked;
/* Inside the Life OS frame the session cookie must be partitioned to stick; the server sets it so when told. */
const framed=(()=>{try{return window.top!==window}catch(e){return true}})();
/* The log in and sign-up forms are real forms, so browsers offer to save the password and fill it in next time. */
document.addEventListener('submit',e=>{const f=e.target.closest('#authf,#setupf');if(!f)return;e.preventDefault();act(f.dataset.act,f.querySelector('[type=submit]'))});
document.addEventListener('click',async e=>{
  const m=e.target.closest('[data-mode]');if(m){mode=m.dataset.mode;msg='';fg=null;draw();if(mode==='forgot'){try{const was=resetMode;await resetInfo();if(resetMode!==was&&mode==='forgot')draw()}catch(x){}}return}
  /* Sign in with Google: the stay-logged-in choice goes with it. */
  const g=e.target.closest('[data-gsi]');if(g){e.preventDefault();const q=new URLSearchParams({stay:stayOn()?'1':'0'});location.href='/auth/google?'+q;return}
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='FORM')return;act(b.dataset.act,b)});
async function act(a,b){msg='';
  try{
    if(a==='login'){await api('POST','/api/login',{email:v('email'),password:v('pw'),stay:stayOn(),framed});if(nextUrl)return location.replace('/');return load()}
    if(a==='signup'){if(!v('first').trim()||!v('last').trim())return show('Enter your first and last name.');if(v('pw')!==v('pw2'))return show('The two passwords do not match.');if(!v('sq'))return show('Choose a security question.');
      await api('POST','/api/signup',{firstName:v('first'),lastName:v('last'),email:v('email'),password:v('pw'),confirm:v('pw2'),question:v('sq'),answer:v('sa'),...demoBody(),stay:stayOn(),framed});if(nextUrl)return location.replace('/');return load()}
    if(a==='setup'){if(me.password===false&&v('pw')!==v('pw2'))return show('The two passwords do not match.');const full=me.password===false,b=$('#first')?{firstName:v('first'),lastName:v('last')}:{};
      if(full)Object.assign(b,demoBody(),{password:v('pw'),confirm:v('pw2')});if($('#sq'))Object.assign(b,{question:v('sq'),answer:v('sa')});
      await api('POST','/api/account/setup',b);if(nextUrl)return location.replace('/');return load()}
    if(a==='forgot'||a==='fgmail'){try{await api('POST','/api/forgot',{email:v('email')})}catch(x){if(/not switched on/.test(x.message)){resetMode='direct';return draw()}throw x}return show('Check your email for a reset link. It works for one hour.',true)}
    if(a==='fgnext'){const em=v('email').trim();try{fg=await api('POST','/api/forgot/questions',{email:em});fgEmail=em}catch(x){if(/reset by email/.test(x.message)){resetMode='email';return show('This site resets passwords by email. Enter your recovery email.')}throw x}return draw()}
    if(a==='fgback'){fg=null;return draw()}
    if(a==='rqopen'){rqOpen=true;return draw()}
    if(a==='rqclose'){rqOpen=false;return draw()}
    if(a==='rqsave'){const r=await api('PUT','/api/recovery',{current:v('rcur'),items:[0,1,2].map(i=>({question:v('rq'+i),answer:v('ra'+i)}))});me.recovery=r.recovery;rqOpen=false;return show('Recovery questions saved.',true)}
    if(a==='direct'){if(!v('pw'))return show('Enter a new password.');if(v('pw')!==v('pw2'))return show('The two new passwords do not match.');const was=fg&&fg.password===false;await api('POST','/api/forgot/direct',{email:fgEmail,question:fg&&fg.question,answer:v('ra'),firstName:v('first'),lastName:v('last'),password:v('pw'),confirm:v('pw2')});fg=null;mode='login';return show(was?'Password set. Log in with your email and new password.':'Password changed. Log in with your new password.',true)}
    if(a==='pwopen'){pwOpen=true;return draw()}
    if(a==='pwclose'){pwOpen=false;return draw()}
    if(a==='pwsave'){if(v('pw')!==v('pw2'))return show('The two new passwords do not match.');await api('POST','/api/password',{current:v('cur'),password:v('pw')});pwOpen=false;return show('Password changed.',true)}
    if(a==='reset'){if(v('pw')!==v('pw2'))return show('The two new passwords do not match.');await api('POST','/api/reset',{token:resetTok,password:v('pw')});location.replace('/account.html?next=1');return}
    if(a==='logout'){await api('POST','/api/logout');me=null;mode='login';draw();return}
    if(a==='mklink'){const r=await api('POST','/api/connector');newLink=r.url;return load()}
    if(a==='offlink'){await api('DELETE','/api/connector');newLink='';return load()}
    if(a==='copy'){try{await navigator.clipboard.writeText(newLink);b.textContent='Copied'}catch(x){const r=document.createRange();r.selectNodeContents($('#lnk'));getSelection().removeAllRanges();getSelection().addRange(r)}return}
    if(a==='sync')return syncAll();
    if(a==='backups'){backups=(await api('GET','/api/storage/backups')).backups;return draw()}
    if(a==='gtest'){b.textContent='Testing…';test=await api('POST','/api/google/test',{});return load()}
    if(a==='goff'){await api('DELETE','/api/google/connect');test=null;return load()}
    if(a==='accts'){accounts=(await api('GET','/api/admin/accounts')).accounts;return draw()}
    if(a==='doc'){doc=await api('GET','/api/admin/page?name='+b.dataset.name);return draw()}
    if(a==='docsave'){doc=await api('PUT','/api/admin/page',{name:doc.name,text:v('doctext')});return show('Saved. The page now shows your version.',true)}
    if(a==='docreset'){doc=await api('DELETE','/api/admin/page?name='+doc.name);return show('Back to the built-in wording.',true)}
    if(a==='docclose'){doc=null;return draw()}
    if(a==='hreset'){me.hierarchy=await api('DELETE','/api/admin/hierarchy');return draw()}
    if(a==='askdel'){confirmDel=true;draw();return}
    if(a==='nodel'){confirmDel=false;draw();return}
    if(a==='delacct'){await api('DELETE','/api/account');me=null;confirmDel=false;mode='login';draw();return}
  }catch(x){show(x.message)}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!e.target.form){const p=document.querySelector('.btn.pri');if(p)p.click()}});
async function resetInfo(){const r=await api('GET','/api/reset/mode');resetMode=r.mode;resetEmail=!!r.email;qlist=Array.isArray(r.questions)?r.questions:qlist}
async function load(){try{me=await api('GET','/api/me')}catch(e){me=null}if(me&&Array.isArray(me.questions))qlist=me.questions;if(!me){try{await resetInfo()}catch(e){}if(!gsi){try{gsi=await api('GET','/api/auth/config')}catch(e){gsi={}}}if(gsiMsg&&!msg)msg=`<div class="err">${esc(gsiMsg)}</div>`}draw();if(me&&me.storage&&me.storage.on&&me.storage.waiting&&!me.storage.error)syncAll()}
load();
</script>
</body>
</html>
