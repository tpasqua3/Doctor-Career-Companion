<style>
/* Layout: one reading column for a phone or a laptop, sticky tab strip on top, and a fixed audio transport along the bottom whenever a lesson is loaded. Lesson text is set in a book face because it is read as well as heard; numbers are monospaced like a chart. */
:root{
  --paper:#f2f5f4; --card:#ffffff; --ink:#12242b; --muted:#55686f; --line:#d5dedc;
  --teal:#0d6e6a; --teal-ink:#ffffff; --teal-soft:#dcefec; --amber:#a8690a; --amber-soft:#f8edd6;
  --good:#1b7a4e; --good-soft:#dff2e7; --bad:#b23a2a; --bad-soft:#fae6e2;
  --read:"IBM Plex Serif",Georgia,"Times New Roman",serif; --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0c1517; --card:#142023; --ink:#e3ecea; --muted:#93a6a6; --line:#24363a;
  --teal:#5fc9bf; --teal-ink:#0c1517; --teal-soft:#16302f; --amber:#eab455; --amber-soft:#2e2613;
  --good:#55c591; --good-soft:#143021; --bad:#f0836f; --bad-soft:#3a1d18; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0c1517; --card:#142023; --ink:#e3ecea; --muted:#93a6a6; --line:#24363a;
  --teal:#5fc9bf; --teal-ink:#0c1517; --teal-soft:#16302f; --amber:#eab455; --amber-soft:#2e2613;
  --good:#55c591; --good-soft:#143021; --bad:#f0836f; --bad-soft:#3a1d18; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui);margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:10px 150px}
h1,h2,h3{font-family:var(--read);font-weight:600;line-height:1.22;text-wrap:balance;margin:0}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0} a{color:var(--teal)}
button,input,select,textarea{font:inherit;color:inherit}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 4px}
.brand{font-family:var(--read);font-weight:600;font-size:1.15rem}
.sync{font-size:.78rem;color:var(--muted)} .sync[data-warn="1"]{color:var(--amber)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:6px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--teal-soft);color:var(--teal);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.plain{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.btn{font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.link{border:0;background:none;color:var(--teal);padding:4px 0}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.tab:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.item:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input[type=text],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;font-weight:600;flex:1;min-width:150px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--card);padding:8px 12px;cursor:pointer;flex:1;white-space:nowrap;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink);font-weight:600}
.note{background:var(--amber-soft);border-radius:9px;padding:10px 12px;font-size:.88rem}
.err{background:var(--bad-soft);color:var(--bad);border-radius:9px;padding:10px 12px;font-size:.88rem}
.chip{display:inline-block;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--teal-soft);color:var(--teal);white-space:nowrap}
.chip.warn{background:var(--amber-soft);color:var(--amber)} .chip.good{background:var(--good-soft);color:var(--good)} .chip.bad{background:var(--bad-soft);color:var(--bad)} .chip.off{background:var(--paper);color:var(--muted);border:1px solid var(--line)}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:.9rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--teal);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
/* figures */
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.fig{display:flex;flex-direction:column;gap:2px;min-width:0}
.fig b{font-family:var(--num);font-size:1.35rem;font-weight:500;font-variant-numeric:tabular-nums}
.fig span{font-size:.76rem;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--muted)}
.day i{display:block;width:100%;height:8px;border-radius:4px;background:var(--line)}
.day[data-on="1"] i{background:var(--teal)} .day[data-today="1"]{color:var(--ink);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:70px}
.bars div{flex:1;background:var(--teal);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
.bars div[data-z="1"]{background:var(--line)}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden;min-width:60px;flex:1}
.meter i{display:block;height:100%;background:var(--teal)}
/* lists */
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
/* lesson text */
.lesson{font-family:var(--read);font-size:1.06rem;line-height:1.7;max-width:66ch}
.lesson section{padding:10px 12px;margin-inline:-12px;border-radius:8px;display:flex;flex-direction:column;gap:6px}
.lesson section[data-now="1"]{background:var(--teal-soft)}
.lesson h3{font-size:1.02rem}
ul.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
/* questions */
.stem{font-family:var(--read);font-size:1.04rem;line-height:1.65;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:10px 12px;cursor:pointer;width:100%}
.opt b{font-family:var(--num);font-weight:500;color:var(--muted)}
.opt[data-s="right"]{border-color:var(--good);background:var(--good-soft)}
.opt[data-s="wrong"]{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.rate{display:flex;gap:6px;flex-wrap:wrap}
.rate button{flex:1;min-width:52px;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-size:.72rem;color:var(--muted)}
.rate button b{font-family:var(--num);font-size:1.05rem;color:var(--ink);font-weight:500}
.rate button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-soft)}
.md p+p,.md ul+p,.md p+ul{margin-top:8px} .md ul{margin:0;padding-left:20px}
.msg{border-radius:12px;padding:10px 13px;max-width:92%}
.msg.u{align-self:flex-end;background:var(--teal-soft)} .msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.flash{display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;min-height:230px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;cursor:pointer;font-family:var(--read);font-size:1.14rem;line-height:1.55}
.flash .a{border-top:1px solid var(--line);padding-top:12px}
.flash .eyebrow{font-family:var(--ui)}
.conf{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.conf button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.7rem;line-height:1.2;color:var(--muted);min-width:0;text-align:center}
.conf button b{font-family:var(--num);font-size:1.05rem;color:var(--ink);font-weight:500}
.clist{display:flex;flex-direction:column;gap:14px;font-family:var(--read);max-width:66ch}
.clist div{display:flex;flex-direction:column;gap:3px;border-bottom:1px solid var(--line);padding-bottom:12px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;border:0;border-radius:99px;background:var(--ink);color:var(--paper);padding:12px 20px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.28)}
.fab[data-up="1"]{bottom:calc(158px + env(safe-area-inset-bottom,0px))}
.askp{position:fixed;right:0;bottom:0;z-index:12;width:min(440px,100%);height:min(80%,660px);background:var(--paper);border:1px solid var(--line);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(0,0,0,.2);padding-bottom:env(safe-area-inset-bottom,0px)}
.askp .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.askp .log{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px;min-height:0}
.askp .ft{padding:10px 16px 12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.askp textarea{min-height:52px;max-height:120px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 11px;font-size:.8rem;cursor:pointer;white-space:nowrap}
.caveat{background:var(--amber-soft);border-radius:8px;padding:8px 11px;font:500 .86rem/1.45 var(--ui)}
.caveat b{color:var(--amber)}
.land{display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) 34px;gap:8px;align-items:center}
.ln{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.lbar{position:relative;height:12px;background:linear-gradient(var(--line),var(--line)) center/1px 100% no-repeat}
.lbar i{position:absolute;top:1px;bottom:1px;border-radius:3px}
.lbar i.neg{right:50%;background:var(--amber)} .lbar i.pos{left:50%;background:var(--teal)}
.lv{text-align:right}
.ltab{font-family:var(--ui);font-size:.86rem;margin-top:4px}
.ltab caption{text-align:left;font-weight:600;padding-bottom:6px}
.ltab th,.ltab td{white-space:normal;vertical-align:top;min-width:84px}
.ltab td:first-child{font-weight:600}
/* audio transport */
.player{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.player .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.player .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex;align-items:center;gap:8px}
.ctl button{border:1px solid var(--line);background:var(--card);border-radius:50%;width:42px;height:42px;cursor:pointer;display:grid;place-items:center;flex:none}
.ctl button.big{width:54px;height:54px;background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.ctl svg{width:20px;height:20px;fill:currentColor}
.ctl .sp{border-radius:9px;width:auto;padding:0 10px;font-family:var(--num);font-size:.85rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(120px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:9px;font-size:.88rem;z-index:20;max-width:calc(100% - 32px)}
</style>
<div class="wrap">

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,44);
const dayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pct=(a,b)=>b?Math.round(100*a/b):0;
/* The AI's JSON is not guaranteed to keep its shape: a list can come back as a single string or be missing. A() always yields a list. */
const A=v=>Array.isArray(v)?v:(v==null||v===''||v===false)?[]:[v];
const hm=m=>{m=Math.round(m);return m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min'};
let toastT=null;function toast(t,ms=3500){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,ms)}
/* A table from the AI, cut to a safe size. Tables are visual aids: they are shown, never read aloud. */
const cleanTable=x=>{if(!x||typeof x!=='object')return null;const c=A(x.columns).map(v=>String(v).slice(0,60)).slice(0,6),r=A(x.rows).filter(Array.isArray).map(row=>row.slice(0,c.length||6).map(v=>String(v??'').slice(0,160))).filter(row=>row.some(Boolean)).slice(0,14);return c.length>=2&&r.length>=2?{t:String(x.title||'').slice(0,90),c,r}:null};
const tableHTML=tb=>tb?`<div class="tablewrap"><table class="ltab">${tb.t?`<caption>${esc(tb.t)}</caption>`:''}<thead><tr>${tb.c.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${tb.r.map(r=>`<tr>${tb.c.map((_,i)=>`<td>${esc(r[i]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`:'';
function mdTables(t){const lines=String(t||'').split(/\n/),out=[];let buf=[];const flush=()=>{if(buf.length>=2){const rows=buf.filter(l=>!/^\s*\|?[\s:|-]+\|?\s*$/.test(l)).map(l=>l.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim().replace(/\*\*/g,'')));const tb=cleanTable({columns:rows[0],rows:rows.slice(1)});out.push(tb?{tb}:buf.join('\n'))}else out.push(...buf);buf=[]};
  lines.forEach(l=>{if(/^\s*\|.*\|\s*$/.test(l))buf.push(l);else{flush();out.push(l)}});flush();return out}
function md(t){if(/^\s*\|.*\|\s*$/m.test(String(t||''))){let txt=[];const parts=[];mdTables(t).forEach(x=>{if(typeof x==='string')txt.push(x);else{if(txt.length){parts.push(md0(txt.join('\n')));txt=[]}parts.push(tableHTML(x.tb))}});if(txt.length)parts.push(md0(txt.join('\n')));return parts.join('')}return md0(t)}
const speakable=t=>mdTables(t).map(x=>typeof x==='string'?x:'There is a table on screen for this.').join('\n').replace(/[*#_`|]/g,'');
function md0(t){const out=[];let ul=null;String(t||'').split(/\n/).forEach(l=>{const li=/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/.exec(l);const f=x=>esc(x).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/^#{1,4}\s*/,'');
  if(li){if(!ul){ul=[];out.push(ul)}ul.push('<li>'+f(li[1])+'</li>')}else{ul=null;if(l.trim())out.push('<p>'+(/^#{1,4}\s/.test(l)?'<b>'+f(l)+'</b>':f(l))+'</p>')}});
  return '<div class="md">'+out.map(x=>Array.isArray(x)?'<ul>'+x.join('')+'</ul>':x).join('')+'</div>'}
const thinking=t=>`<div class="thinking"><span class="dot"></span><span>${esc(WEB&&WEBAI!=='claude'?String(t).replace(/^Claude/,'The AI'):t)}</span></div>`;

/* ---------- Curriculum ----------
   Four tracks. Internal medicine follows the subject divisions of a board review syllabus; the other three are the practice-building tracks.
   w = how much the planner favors a section (3 = core outpatient). A trailing ~ marks a topic that is mainly hospital medicine.
   lib = folder titles in the reference library (Google Drive) that hold this section's chapters. */
const TRACKS=[
 {id:'im',name:'Internal Medicine',blurb:'Board content by body system',sections:[
  {id:'cv',name:'Cardiovascular Medicine',w:3,lib:['Cardiology'],src:'ACC/AHA, ESC, USPSTF',topics:['Hypertension','Lipid management and ASCVD risk','Chronic coronary disease','Acute coronary syndromes~','Heart failure','Atrial fibrillation and anticoagulation','Arrhythmias and syncope','Valvular heart disease','Peripheral artery and aortic disease','Preoperative cardiac evaluation','Pericardial and myocardial disease~','Adult congenital and pregnancy-related heart disease']},
  {id:'endo',name:'Endocrinology and Metabolism',w:3,lib:['Endocrinology'],src:'ADA Standards of Care, Endocrine Society, AACE, ATA, BHOF',topics:['Type 2 diabetes','Type 1 diabetes and insulin management','Obesity medicine','Thyroid disorders','Thyroid nodules and cancer','Osteoporosis and bone health','Calcium and parathyroid disorders','Adrenal disorders','Pituitary disorders','Male hypogonadism','Menopause and female reproductive endocrinology','Hyperglycemic emergencies and inpatient glycemic control~']},
  {id:'gim',name:'General Internal Medicine',w:3,lib:['Interdisciplinary','Foundations','Common Symptoms'],src:'USPSTF, CDC/ACIP, ACP, AGS, APA, ACOG',topics:['Preventive care and screening','Immunizations','Perioperative medicine','Geriatric syndromes and deprescribing','Women\'s health','Men\'s health','Depression and anxiety in primary care','Substance use disorders','Chronic pain and opioid stewardship','Musculoskeletal and sports medicine','Common symptoms: cough, fatigue, dizziness, edema','Eye, ear, nose and throat problems','Palliative care and goals of care','Biostatistics and evidence appraisal','Ethics and professionalism','Patient safety and quality improvement','Allergic rhinitis, anaphylaxis and drug allergy','Lifestyle medicine and nutrition counseling']},

/* ---------- The board blueprint ----------
   The ABIM publishes what its internal medicine examination covers: content categories with a share of the exam each, and under them
   topics rated high, medium or low relevance for four tasks. The physician keeps that document in Google Drive; the page reads it once,
   keeps the parsed outline in the record, and builds a Boards track from it so lessons, questions and cards follow the exam itself. */
function parseBlueprint(text){const u=s=>s.replace(/\\+/g,'').trim(),cats=[],by={};let cur=null,sub='',started=false;
  text.split('\n').forEach(raw=>{const l=u(raw);let m;
    if(!started&&(m=/^\|\s*([A-Z][A-Za-z ,&\/\-]+?)\s*\|\s*(\d+(?:\.\d+)?)%\s*\|/.exec(l))){const c={name:m[1].trim(),pct:Number(m[2]),topics:[]};if(!by[c.name.toUpperCase()]){by[c.name.toUpperCase()]=c;cats.push(c)}return}
    if((m=/\*\*([A-Z][A-Z ,&\/\-]+?)\*\*/.exec(l))&&by[m[1].trim()]){cur=by[m[1].trim()];started=true;if(!/% of exam/.test(l.replace(m[0],''))||/^\|/.test(l))return}
    if((m=/^\*\*([A-Z][^*]+?)\*\*\s*\*[^(]*\(\s*<?\s*\d+(?:\.\d+)?\s*% of exam\)/.exec(l))&&!by[m[1].trim()]){sub=m[1].trim();return}
    if(cur&&(m=/^\|\s*(.+?)\s*\|\s*\*\*(HIGH|MEDIUM|LOW)\*\*\s*\|\s*\*\*(HIGH|MEDIUM|LOW)\*\*\s*\|\s*\*\*(HIGH|MEDIUM|LOW)\*\*\s*\|\s*\*\*(HIGH|MEDIUM|LOW)\*\*/.exec(l))){
      const lf=/\*\*LF\*\*/.test(m[1])||/L[dn]?F(?=[a-z])/.test(m[1]),name=m[1].replace(/\*\*LF\*\*/g,'').replace(/L([dn])F(?=[a-z])/,'$1').replace(/\*/g,'').replace(/\s+/g,' ').trim();
      if(!cur.topics.some(t=>t.n===name))cur.topics.push({n:name,lf:lf?1:0,sub:sub.charAt(0)+sub.slice(1).toLowerCase(),r:m.slice(2,6).map(x=>x[0]).join('')})}});
  return cats.filter(c=>c.topics.length)}

/* ---------- What the record says about where help is needed ----------

/* ---------- The tailored learning plan ----------
   Priority follows what the physician has shown: wrong answers, low self-ratings, cards rated low, questions put to the companion, named
   gaps. The exam blueprint sets the frame those signals work within. The formula ranks every topic; the AI then reads the top of that ranking next to the study record and lays out a roadmap to the exam
   and rolling blocks of work (now, next, after that),
   choosing where an hour buys the most and grouping related topics. Topics on the plan move to the front of every session. */
const examDays=()=>{if(!st.prefs.examDate)return 0;const d=Math.ceil((new Date(st.prefs.examDate+'T12:00:00')-Date.now())/864e5);return d>0?d:0};
const started=id=>{const x=st.topics[id];return !!x&&(x.les>0||x.n>=3)};
async function makePlan(sc){const lm=lowCards(),cand=rankedBase().filter(r=>sc==='abim'?r.t.bp&&bw(r.t)>0:!r.t.bp).slice(0,60),cm=COMMIT[st.prefs.commit],perWeek=st.prefs.perWeek||Math.min(7,Math.max(3,Math.round(span(28).act/4)||5)),days=examDays(),MIX={listen:'mostly audio lessons, with a few questions to check',bal:'a balance of audio lessons, questions and flashcards',q:'mostly questions and flashcards, with short lessons where an answer exposes a gap'};
  const r=await ask(`You are the chief resident planning one physician's study. ${st.prefs.about}\nGoal: ${sc==='abim'?'pass the ABIM internal medicine examination'+(days?', which is '+days+' days away':''):'stay a well-rounded internist, with outpatient medicine first'}.${st.prefs.priority?'\nThe physician\'s own stated priority, which comes first: '+st.prefs.priority:''}\nTimeline: ${days?'about '+Math.round(days/30)+' months ('+Math.round(days/7)+' weeks)':'open-ended, no target date'}.\nPreferred delivery: ${MIX[st.prefs.mix]||MIX.bal}.\nStudy record:\n${recordSummary()}${notes().summary?'\nRunning note from the questions they ask the tutor: '+notes().summary:''}\nStrength and weakness by discipline, in points out of 100 from all of the above, each compared with this physician's own average:\n${landText()}${ite()?'\nIn-training exam: '+ite().exam+(ite().year?' '+ite().year:'')+(ite().overall!=null?', '+ite().overall+'% correct overall':'')+(ite().pctile!=null?', percentile '+ite().pctile:'')+'. '+ite().missed.length+' objectives missed.':''}\nTime available: about ${cm.min} minutes a session and ${perWeek} sessions a week; a session covers ${cm.lessons} topic${cm.lessons>1?'s':''}.\n\nCANDIDATE TOPICS, already ranked by a formula of exam share, blueprint relevance and current mastery. Relevance is four letters for diagnosis, treatment, risk and pathophysiology (H high, M medium, L low); LF means low frequency.\n${cand.map((x,i)=>`${i}. ${x.t.name} | ${x.t.sec.name}${x.t.bp?` | ${x.t.sec.pct}% of exam | ${x.t.bp.r}${x.t.bp.lf?' LF':''}`:''} | mastery ${mastery(x.t.id)??'none'} | ${st.topics[x.t.id]&&st.topics[x.t.id].n?st.topics[x.t.id].c+'/'+st.topics[x.t.id].n+' correct':'no questions yet'}${st.topics[x.t.id]&&st.topics[x.t.id].rate?' | self-rated '+st.topics[x.t.id].rate+'/5':''}${st.topics[x.t.id]&&st.topics[x.t.id].asks?' | asked the tutor about it '+st.topics[x.t.id].asks+' times':''}${lm[x.t.id]?' | '+lm[x.t.id]+' flashcards rated low':''}${x.t.id in focusMap()?' | their questions point here':''}${iteMissed()[x.t.id]?' | missed on the in-training exam':''}${st.gaps.some(g=>!g.done&&g.tid===x.t.id)?' | named as a gap':''} | ${x.why}`).join('\n')}\n\nBuild an open-ended, rolling plan. It has no end date of its own: it is rebuilt as the record changes and runs until the physician is ready${sc==='abim'?' for the examination':''}. Give a roadmap of phases from today to ${days?(sc==='abim'?'the examination':'the target date')+' ('+Math.round(days/7)+' weeks away), ending '+(sc==='abim'?'board-ready ':'')+'with the last stretch kept for mixed questions and review':'steady long-term growth with no end date'}, and then three blocks of specific topics drawn from these candidates only: what to do now, next, and after that. The physician works at their own pace: order matters, dates do not. Do not attach deadlines or weekly quotas to the blocks, and give roadmap timing only as a rough guide. Two things decide the order. First, the big picture: stay inside what the exam weights most, a large share of the exam and high blueprint relevance. Second, within that, go where this physician has shown the most uncertainty: questions answered wrong, low self-ratings, flashcards rated low, topics they keep asking the tutor about, gaps they named, and topics where confidence runs ahead of accuracy. Demonstrated weakness outranks a topic that is merely untouched. Lean toward the disciplines that sit below this physician's own average, and treat objectives missed on the in-training exam as confirmed gaps. As the record fills in, the plan should follow the evidence. Group related topics in the same week so each builds on the last, and mix categories so no week is a single subject. Put about ${perWeek*cm.lessons} topics in the first block, about ${perWeek*cm.lessons*2} in the second and the rest that matter in the third. Do not repeat a topic.\n\nReply with JSON only: {"summary":"3 or 4 sentences on the strategy and why these areas come first","roadmap":[{"phase":"name","when":"e.g. months 1 to 4","goal":"what is done by the end of it"}],"weeks":[{"focus":"short theme","why":"one sentence","topics":[{"i":0,"reason":"a few words"}]}],"habits":["2 or 3 habits that fit this physician's pattern of use, timeline and preferred delivery"]}`,'complex');
  const seen=new Set(),weeks=A(r.weeks).map(w=>({focus:String(w.focus||''),why:String(w.why||''),items:A(w.topics).map(x=>{const c=cand[x&&x.i];if(!c||seen.has(c.t.id))return null;seen.add(c.t.id);return {tid:c.t.id,reason:String(x.reason||'')}}).filter(Boolean)})).filter(w=>w.items.length);

const planForm=()=>{const d=examDays(),P=st.prefs,u=!P.examDate?'open':P.tlU||'months',tn=P.tlN||(u==='weeks'?Math.max(1,Math.round(d/7)):Math.max(1,Math.round(d/30.4)))||8;return `<div class="plain"><span class="eyebrow">Plan settings</span>

/* ---------- The companion ----------
   One conversation, opened from the corner of any screen. It is told what is on screen (the lesson, question, card or topic), pulls the
   matching chapter from the reference library for the question asked, and knows the blueprint relevance and the study record. */
function ctxInfo(){let tid=null,text='',label='';
  if(S.quiz&&S.quiz.i<S.quiz.qs.length){const q=S.quiz.qs[S.quiz.i],pk=S.quiz.picks[q.id];tid=q.tid;label='this question';text=`The physician is looking at this practice question: "${q.stem}" Options: ${q.opts.map((o,i)=>'ABCDE'[i]+'. '+o).join(' ')}. `+(pk!=null?`They chose ${'ABCDE'[pk]}; the keyed answer is ${'ABCDE'[q.ans]}. Explanation shown: ${q.exp}`:'They have NOT answered yet. Do not reveal or hint at which option is correct; help them reason toward it.')}
  else if(S.lesson){tid=S.lesson.tid;label='this lesson';text=`The physician is in the lesson "${S.lesson.title}". Its key points: ${S.lesson.pts.join(' ')}`}
  else if(S.deck&&S.deck.i<S.deck.ids.length){const c=findC(S.deck.ids[S.deck.i]);if(c){tid=c.tid;label='this card';text=`The physician is on the flashcard "${c.f}"`+(S.deck.flip?` with the answer "${c.b}"`:'. The answer is still hidden: do not give it away unless asked.')}}
  else if(S.tab==='learn'&&S.topic&&TOP[S.topic]){tid=S.topic;label=TOP[tid].name;text='The physician is viewing the topic "'+TOP[tid].name+'".'}
  return {t:tid&&TOP[tid],text,label}}
function matchTopic(text,strict){const k=[...new Set(words(text))].filter(w=>!/^(workup|work|treat|treatment|treating|diagnosis|diagnosing|guideline|guidelines|review|update|updates|basics|overview|outpatient|inpatient|clinic|acute|chronic|adult|adults|patient|patients)$/.test(w));if(!k.length)return null;const board=planScope()==='abim';let best=null;
  Object.values(TOP).forEach(t=>{const tw=words(t.name),n=k.filter(x=>tw.some(w=>w.startsWith(x.slice(0,5))||x.startsWith(w.slice(0,5)))).length;if(!n||(strict&&(n<Math.min(2,k.length)||n<tw.length/2)))return;const sc=n/Math.sqrt(tw.length||1)+(!!t.bp===board?.3:0);if(!best||sc>best.sc)best={sc,t}});return best&&best.t}
async function sendChat(text){text=String(text||'').trim();if(S.asking||!text)return;if(!SAMPLE)return toast(ERR.unavailable);
  const cx=ctxInfo();S.chat.push({role:'user',content:text});S.asking=true;redrawChat();
  try{const t=cx.t||matchTopic(text);if(t){const x=tS(t.id);x.asks=(x.asks||0)+1;x.asked=Date.now();saveState()}const ref=t?await libRef(t,text):null;
    const sys=`You are the study companion inside a physician's board preparation and continuing education app: part tutor, part chief resident. ${st.prefs.about}\nStudy record:\n${recordSummary()}\n${hasBP()?'The physician is preparing for the ABIM internal medicine examination. When the question bears on the exam, say how the point is tested and what to prioritize, in a sentence or two.\n':''}${notes().summary?'Running note on what this physician has been trying to understand: '+notes().summary+'\\n':''}Answer at attending level, concisely, as a colleague would. Reason it through. Name the guideline and year, or the landmark trial, behind a recommendation. Never invent a citation, statistic, dose or threshold. When any part of the answer is uncertain, disputed between societies, or may have changed recently, flag it in its own short line beginning "Uncertain:" so it is seen and heard. When the answer involves a graded classification, staging, criteria set, thresholds by level or a side-by-side comparison, give a compact markdown table for it and also state the key levels in a sentence, because the answer may be listened to and tables are not read aloud. For EHR, billing and quality topics, flag what depends on the local build or payer. You have no live web access here.`;
    const extra=`${cx.text?'\n\nON SCREEN: '+cx.text:''}${t&&t.bp?`\nBlueprint: ${t.name}, in ${t.sec.name} (${t.sec.pct}% of the exam). Relevance: ${TASKS.map((k,i)=>k+' '+RL[t.bp.r[i]]).join('; ')}.`:''}${refBlock(ref&&{title:ref.title,text:ref.text.slice(0,9000)})}`;
    const hist=S.chat.slice(-11);while(hist.length&&hist[0].role!=='user')hist.shift();
    const r=await askText(hist.map((m,i)=>({role:m.role,content:(i===0?sys+'\n\n':'')+m.content+(i===hist.length-1?extra:'')})),'default');
    S.chat.push({role:'assistant',content:r,ref:ref?ref.title:''});
    const AD=asksDoc();AD.e.push({t:Date.now(),tid:t?t.id:'',q:text.slice(0,240)});if(AD.e.length>300)AD.e=AD.e.slice(-300);later('asks',()=>put('asks',AD),1500);if(t)pullCards(t.id,2);if(AD.e.length%3===1)updateNotes()}
  catch(e){S.chat.pop();toast(errMsg(e)||'Stopped.',5000)}
  S.asking=false;redrawChat()}
function redrawChat(){drawAsk();if(S.tab==='ask'&&!S.quiz&&!S.lesson&&!S.busy)render()}
const chatLog=()=>S.chat.map((m,i)=>`<div class="msg ${m.role==='user'?'u':'a'}">${m.role==='user'?esc(m.content):md(m.content)+`<div class="row" style="margin-top:6px">${TTS?`<button class="btn sm" data-act="saytext" data-k="chat" data-i="${i}">Listen</button>`:''}${m.ref?`<span class="chip off">${esc(m.ref)}</span>`:''}</div>`}</div>`).join('')+(S.asking?thinking('Claude is thinking…'):'');
function drawAsk(){const el=$('#askp'),fab=$('#fab');fab.hidden=!!S.askOpen||S.tab==='ask';if(!S.askOpen){el.hidden=true;return}const cx=ctxInfo(),draft=($('#askin')||{}).value||'';el.hidden=false;
  el.innerHTML=`<div class="hd"><div style="min-width:0"><b>Ask</b><div class="tiny muted">${cx.label?'About '+esc(cx.label):hasBP()?'Board-focused, grounded in your library':'Grounded in your library and record'}</div></div><div class="row">${S.chat.length?'<button class="btn sm" data-act="chatclear">New</button>':''}<button class="btn sm" data-act="askclose" aria-label="Close">Close</button></div></div>

  ${S.busy?'':`<div class="card"><h3>Request a topic</h3><p class="small muted">Name anything and it is taught, tested or turned into cards now. It is filed under the matching curriculum topic, or kept under My topics if there is none.</p>

/* ----- Boards: the blueprint as a study plan ----- */
function vBoards(){
  if(!hasBP())return `<div class="plain"><h1>Boards</h1><p class="small muted">Board study follows the ABIM's own published blueprint: every content category with its share of the exam, and every topic rated by how likely it is to be tested.</p></div>${busy()}
   ${S.busy?'':`<div class="card"><h3>Load your blueprint</h3><p class="small muted">${MCP?'The page reads the blueprint document from your Google Drive once and keeps the outline in your record.':WEB?'Load the blueprint once inside Claude, where Google Drive is connected. It then appears here with the rest of your record.':'Google Drive is not connected to this page.'}</p>${MCP?`<label class="f">Document title contains<input type="text" id="bpname" value="${esc(st.prefs.bpName)}"></label><div class="row"><button class="btn pri" data-act="bpload">Load from Google Drive</button></div>`:''}</div>`}`;
  const tr=TRACKS[0],b=docs.blueprint,rows=tr.sections.map(s=>({s,x:secStats(s),y:bpSec(s)})),ready=Math.round(rows.reduce((a,r)=>a+r.s.pct*r.y.ready,0)/rows.reduce((a,r)=>a+r.s.pct,0));

  <div class="card"><div class="figs"><div class="fig"><b>${ready}</b><span>readiness, 0 to 100</span></div><div class="fig"><b>${hs}/${hi}</b><span>high-relevance topics started (${pct(hs,hi)}%)</span></div><div class="fig"><b>${n}</b><span>board questions answered</span></div><div class="fig"><b>${n?pct(c,n)+'%':'—'}</b><span>correct</span></div></div>
   <p class="tiny muted">Readiness is your mastery of each topic, weighted by its blueprint relevance and by its category's share of the exam. Untouched topics count as zero, so it starts low and climbs as you cover ground.</p>
   <div class="row"><label class="f" style="max-width:220px">Target exam date<input type="date" id="examdate" value="${esc(st.prefs.examDate)}" style="background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:8px 10px"></label>${days!=null&&days>0?`<span class="small muted">About ${Math.round(days/7)} weeks out · ${hi-hs} high-relevance topics still to start. A guide for the plan, not a deadline: go at your own pace.</span>`:''}</div></div>

  ${busy()}${S.busy?'':`<div class="card"><h2>Board session</h2><div class="plain"><span class="eyebrow">How much today</span>${segBtns('commit',Object.entries(COMMIT).map(([k,v])=>[k,v.name+' · '+v.min+' min']),st.prefs.commit)}</div>
   ${modeRow()}<div class="plain"><span class="eyebrow">Up next from the blueprint</span>${pl.slice(0,cm.lessons).map(r=>`<div><b>${esc(r.t.name)}</b><div class="tiny muted">${esc(r.t.sec.name)} · ${r.t.sec.pct}% of the exam · ${esc(r.why)}</div></div>`).join('')}</div>
   <div class="row"><button class="btn pri" data-act="session" data-sc="abim">${st.prefs.auto?'Listen to':'Read'} a ${cm.min}-minute board session</button><button class="btn" data-act="mixed" data-sc="abim">Board question set (${st.prefs.qn||st.prefs.setSize||5}, level ${qD()})</button><button class="btn" data-act="cboards">Board flashcards</button></div></div>`}
  <div class="card"><h3>By content category</h3><div class="tablewrap"><table><thead><tr><th>Category</th><th class="n">Exam</th><th class="n">High started</th><th class="n">Questions</th><th class="n">Correct</th><th class="n">Ready</th></tr></thead><tbody>
   ${rows.sort((p,q)=>q.s.pct-p.s.pct).map(r=>`<tr><td><button class="btn link" data-sec="${r.s.id}" style="padding:0;text-align:left;white-space:normal">${esc(r.s.name)}</button></td><td class="n">${r.s.pct}%</td><td class="n">${r.y.hs}/${r.y.hi}</td><td class="n">${r.x.n}</td><td class="n">${r.x.n?pct(r.x.c,r.x.n)+'%':'—'}</td><td class="n">${Math.round(r.y.ready)}</td></tr>`).join('')}</tbody></table></div>
   <p class="tiny muted">High relevance: very likely to appear. Medium: moderately likely. Low: will not appear, so it is left out of the plan. Low frequency topics are capped by the ABIM at a small share of questions.</p>

/* ----- Curriculum ----- */
function vLearn(){
  if(S.topic)return vTopic(TOP[S.topic]);
  if(S.sec){const s=SEC[S.sec],x=secStats(s);return `<div class="row"><button class="btn link" data-act="up">← ${esc(s.track.name)}</button></div><div class="plain"><h1>${esc(s.name)}</h1><p class="small muted">Sources: ${esc(s.src)} · ${s.pct?s.pct+'% of the exam · ':''}${x.started}/${x.total} topics started${x.n?` · ${pct(x.c,x.n)}% correct on ${x.n} questions`:''}</p></div>
    <div class="card" style="gap:0">${(()=>{let last='';return s.t.map(t=>{const m=mastery(t.id),[l,c]=level(m),head=t.bp&&t.bp.sub!==last?`<div class="eyebrow" style="padding-top:14px">${esc(last=t.bp.sub)}</div>`:'';return head+`<button class="item" data-topic="${t.id}"><div><b>${esc(t.name)}</b>${t.inp?' <span class="tiny muted">hospital</span>':''}${t.bp?` <span class="chip ${rel(t)==='H'?'':'off'}">${{H:'High',M:'Medium',L:'Not tested'}[rel(t)]}</span>${t.bp.lf?' <span class="tiny muted">low frequency</span>':''}`:''}</div><span class="row" style="flex-wrap:nowrap">${overconfident(t.id)?'<span class="chip bad">Check calibration</span>':''}<span class="chip ${c}">${l}${m!=null?' · '+m:''}</span></span></button>`}).join('')})()}</div>`}
  if(S.track){const tr=TRACKS.find(t=>t.id===S.track);return `<div class="row"><button class="btn link" data-act="up">← All tracks</button></div><div class="plain"><h1>${esc(tr.name)}</h1><p class="small muted">${esc(tr.blurb)}</p></div>
    <div class="card" style="gap:0">${tr.sections.map(s=>{const x=secStats(s);return `<button class="item" data-sec="${s.id}"><div><b>${esc(s.name)}</b><div class="tiny muted">${x.started}/${x.total} topics started${x.n?` · ${pct(x.c,x.n)}% correct`:''}</div></div><span class="row" style="flex-wrap:nowrap;min-width:110px"><span class="meter"><i style="width:${pct(x.started,x.total)}%"></i></span><span class="tiny num muted">${pct(x.started,x.total)}%</span></span></button>`}).join('')}</div>`}
  const recent=st.lessons.slice(-6).reverse();

/* ----- A lesson: text on screen, audio in the transport ----- */
const lessonGist=L=>`"${L.title}". Its sections: ${L.segs.map(x=>x.h).filter(Boolean).join('; ')}. Its key points: ${L.pts.join(' ')}`;
const basisQ=L=>`These questions follow a lesson the physician has studied: ${lessonGist(L)}\nTest whether what that lesson taught can be applied to new patients. Every question must rest on something the lesson covered, in a case the lesson did not use.`;
const basisDeep=L=>`This is a "dig deeper" follow-up to a lesson the physician has already completed: ${lessonGist(L)}\nDo not re-teach those points; assume them. Go further: the mechanism behind the recommendation, the exceptions and special populations, the harder and atypical cases, the trials the guidance rests on and where the evidence is thin, and what a subspecialist would add. Title it so it is clearly the next level on the same subject.`;
const basisDeepQ=L=>`These are "dig deeper" questions following a lesson the physician has completed: ${lessonGist(L)}\nGo beyond what that lesson stated outright: exceptions, special populations, complications of treatment, and what to do when first-line management fails.`;
function lessonQueue(L,withQs){const q=[{say:L.title+'.',seg:0}];L.segs.forEach((s,i)=>{if(s.h)q.push({say:s.h+'.',seg:i});q.push({say:s.x,seg:i});if(s.f)q.push({say:'A note of caution. '+s.f,seg:i});q.push({wait:500,seg:i})});
  if(L.pts.length)q.push({say:'Key points. '+L.pts.join(' '),seg:'pts'});
  if(L.unc&&L.unc.length)q.push({say:'Before you rely on this lesson, verify the following. '+L.unc.join(' '),seg:'unc'});
  if(withQs)L.qids.map(findQ).filter(Boolean).forEach((x,n)=>{q.push({say:`Question ${n+1}. ${x.stem} `+x.opts.map((o,i)=>'ABCDE'[i]+'. '+o+'.').join(' '),seg:'q'+n});q.push({wait:7000,seg:'q'+n});q.push({say:`The answer is ${'ABCDE'[x.ans]}. ${x.opts[x.ans]}. ${x.exp}${x.cav?' A note of caution. '+x.cav:''}`,seg:'q'+n})});return q}
function playLesson(L,done){P.load(lessonQueue(L,st.prefs.passive),L.title,(TOP[L.tid]?TOP[L.tid].sec.name:'')+' · '+(L.min||LEN[L.len].min)+' min',done)}
function vLesson(){const L=S.lesson,t=TOP[L.tid],ss=S.session,qs=L.qids.map(findQ).filter(Boolean),s=tS(L.tid);
  return `<div class="row between"><button class="btn link" data-act="closelesson">← ${ss?'End session':'Back'}</button>${ss?`<span class="chip">Lesson ${ss.i+1} of ${ss.plan.length}${ss.next?' · next is ready':ss.i+1<ss.plan.length?' · writing the next one':''}</span>`:''}</div>
  <div class="plain"><span class="eyebrow">${esc(t?t.sec.name+' · '+t.name:'')}</span><h1>${esc(L.title)}</h1>
   <div class="row"><button class="btn pri" data-act="listen">${IC.play.replace('<svg','<svg width="16" height="16" fill="currentColor"')} ${P.on?'Restart audio':'Listen'}</button><span class="small muted">${LEN[L.len].name} · about ${L.min||LEN[L.len].min} min${L.ref?' · grounded in '+esc(st.prefs.libName)+': '+esc(L.ref):''}</span></div></div>
  <div class="lesson">${L.segs.map((x,i)=>`<section data-seg="${i}">${x.h?`<h3>${esc(x.h)}</h3>`:''}${x.x.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join('')}${tableHTML(x.tb)}${x.f?`<p class="caveat"><b>Uncertain.</b> ${esc(x.f)}</p>`:''}</section>`).join('')}</div>
  ${L.pts.length?`<div class="card" data-seg="pts"><h3>Key points</h3><ul class="pts">${L.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>${L.pit.length?`<h3>Pitfalls</h3><ul class="pts">${L.pit.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`:''}</div>`:''}
  ${L.unc.length?`<div class="note" data-seg="unc"><b>Verify before relying on it.</b><ul class="pts">${L.unc.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
  ${qs.map((q,n)=>`<div class="card" data-seg="q${n}"><span class="eyebrow">Check question ${n+1}</span>${qBody(q,S.lq&&S.lq[q.id])}</div>`).join('')}
  <div class="card"><h3>How well do you know this now?</h3>${rateRow(L.tid,s.rate)}
   <div class="row">${L.done?`<span class="chip good">Completed ${new Date(L.done).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>`:'<button class="btn pri" data-act="lesdone">Mark as complete</button>'}<span class="small muted">${L.done?'Logged in your study record.':'Logs this lesson in your study record. Listening to the end marks it for you.'}</span></div></div>
  ${L.src.length?`<div class="plain"><span class="eyebrow">Sources named in this lesson</span><ul class="pts small muted">${L.src.map(p=>`<li>${esc(p)}</li>`).join('')}</ul><p class="tiny muted">Written by AI${L.ref?' from your reference text':''}. Confirm against the source before changing practice.</p></div>`:''}
  ${S.busy?busy():`<div class="card"><h3>Go further with this lesson</h3>${L.parent&&docs['les_'+L.parent]?`<p class="small muted">Follows <button class="btn link" data-les="${L.parent}" style="padding:0">${esc(docs['les_'+L.parent].title)}</button></p>`:''}
   <div class="plain"><span class="eyebrow">Test what it taught</span><div class="row" style="align-items:flex-end">${qnField()}<button class="btn" data-act="lesq">Questions on this lesson</button><button class="btn" data-act="lescards">Flashcards on it</button></div></div>
   <div class="plain"><span class="eyebrow">Dig deeper</span><span class="small muted">Picks up where this lesson stops: mechanisms, exceptions, harder cases and the evidence behind the guidance.</span><div class="row"><button class="btn pri" data-act="lesdeep" data-kind="lesson">Dig deeper: lesson · ${LEN.deep.min} min</button><button class="btn" data-act="lesdeep" data-kind="quiz">Dig deeper: harder questions</button></div></div></div>`}
  ${ss&&ss.i+1<ss.plan.length?`<div class="row"><button class="btn pri" data-act="nextlesson" ${ss.next?'':'disabled'}>Next lesson</button></div>`:ss?`<div class="row"><button class="btn pri" data-act="closelesson">Finish session</button></div>`:''}`}
const rateRow=(tid,cur)=>`<div class="rate">${[[1,'New to me'],[2,'Shaky'],[3,'Getting there'],[4,'Solid'],[5,'Could teach it']].map(([v,l])=>`<button data-rate="${v}" data-tid="${tid}" aria-pressed="${cur===v}"><b>${v}</b>${l}</button>`).join('')}</div>`;
function qBody(q,picked){const done=picked!=null;
  return `<p class="stem">${esc(q.stem)}</p><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-pick="${i}" data-q="${q.id}" ${done?'disabled':''} data-s="${done?(i===q.ans?'right':i===picked?'wrong':''):''}"><b>${'ABCDE'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>
  ${done?`<div class="plain"><b style="color:var(--${picked===q.ans?'good':'bad'})">${picked===q.ans?'Correct.':'Incorrect. The answer is '+'ABCDE'[q.ans]+'.'}</b><p>${esc(q.exp)}</p>${q.cav?`<p class="caveat"><b>Uncertain.</b> ${esc(q.cav)}</p>`:''}${q.obj?`<p class="small"><b>Educational objective:</b> ${esc(q.obj)}</p>`:''}${q.src&&q.src.length?`<p class="tiny muted">${q.src.map(esc).join(' · ')}</p>`:''}
   <div class="row">${q.d?`<span class="chip off">Level ${q.d}</span>`:''}<span class="chip ${q.rev?'good':'off'}">${q.rev?'Passed accuracy review':'Not reviewed'}</span>${q.ref?`<span class="chip off">${esc(q.ref)}</span>`:''}<button class="btn sm" data-act="sayq" data-q="${q.id}">Listen</button><button class="btn sm" data-act="askq" data-q="${q.id}">Ask about this</button><button class="btn sm ${q.flag?'danger':''}" data-act="flag" data-q="${q.id}">${q.flag?'Flagged as wrong':'Flag as inaccurate'}</button></div></div>`:''}`}
/* Scoring one answer: the topic, the day, the stated gap and the question's own review schedule all update. A miss comes back in 1, 3, 7 and 21 days. */
function score(q,pick){const ok=pick===q.ans,s=tS(q.tid),d=day();q.hist.push({t:Date.now(),ok});s.n++;d.q++;if(ok){s.c++;d.c++}s.last=Date.now();
  if(!ok){q.stage=1;q.due=Date.now()+864e5;pullCards(q.tid,1)}else if(q.stage){q.stage++;q.due=q.stage>4?0:Date.now()+[0,1,3,7,21][q.stage]*864e5}
  const g=q.gap&&st.gaps.find(x=>x.id===q.gap);if(g){g.n=(g.n||0)+1;if(ok)g.c=(g.c||0)+1}
  saveBank(TOP[q.tid].sec.id);saveState();return ok}

/* ----- Question sets ----- */
function startQuiz(qs,title,tid){if(!qs.length)return toast('No questions to show.');P.stop();endAct();S.quiz={qs,i:0,picks:{},title,tid:tid||'',id:uid(),note:''};S.lesson=null;beginAct('quiz',tid,title);render();scrollTo(0,0)}
function endQuiz(){const Q=S.quiz;if(!Q)return;const n=Object.keys(Q.picks).length;endAct({n,c:Q.qs.filter(q=>Q.picks[q.id]===q.ans).length});if(n){st.sets.push({t:Date.now(),title:Q.title,tid:Q.tid,n,c:Q.qs.filter(q=>Q.picks[q.id]===q.ans).length,total:Q.qs.length});if(st.sets.length>150)st.sets.shift();saveState()}S.quiz=null}
function vQuiz(){const Q=S.quiz,n=Object.keys(Q.picks).length;
  if(Q.i>=Q.qs.length){const c=Q.qs.filter(q=>Q.picks[q.id]===q.ans).length,tids=[...new Set(Q.qs.map(q=>q.tid))].slice(0,4);
    return `<div class="card"><span class="eyebrow">${esc(Q.title)}</span><h1>Set complete</h1><div class="figs"><div class="fig"><b>${c}/${n}</b><span>correct</span></div><div class="fig"><b>${pct(c,n)}%</b><span>this set</span></div><div class="fig"><b>${pct(n,Q.qs.length)}%</b><span>completed</span></div></div>
    ${tids.map(id=>`<div class="plain"><b>${esc(TOP[id].name)}</b><span class="small muted">How well do you know this now?</span>${rateRow(id,tS(id).rate)}</div>`).join('')}

  <div class="card"><span class="eyebrow">${esc(TOP[q.tid].sec.name)} · ${esc(TOP[q.tid].name)}</span>${qBody(q,Q.picks[q.id])}${Q.picks[q.id]!=null?`<div class="row"><button class="btn pri" data-act="qnext">${Q.i+1<Q.qs.length?'Next question':'See results'}</button></div>`:`<div class="row"><button class="btn sm" data-act="sayq" data-q="${q.id}">Read it to me</button></div>`}</div>
  <div class="meter"><i style="width:${pct(n,Q.qs.length)}%"></i></div>`}
function vQuestions(){const all=allQs(),ans=all.filter(q=>q.hist.length),tot=Object.values(st.topics).reduce((a,t)=>a+t.n,0),cor=Object.values(st.topics).reduce((a,t)=>a+t.c,0),due=dueQs().length,gaps=st.gaps;

  <div class="card"><div class="figs"><div class="fig"><b>${tot}</b><span>answered</span></div><div class="fig"><b>${tot?pct(cor,tot)+'%':'—'}</b><span>correct overall</span></div><div class="fig"><b>${st.sets.length}</b><span>sets</span></div><div class="fig"><b>${due}</b><span>due for review</span></div></div>
   ${busy()}${S.busy?'':`<div class="row" style="align-items:flex-end">${qnField()}<button class="btn pri" data-act="mixed">Write a mixed set</button>${diffRow()}</div><p class="small muted">A mixed set draws on the topics your record ranks highest, a few questions from each. Allow roughly a minute for every five questions.</p><div class="row">${due?`<button class="btn" data-act="review">Review ${due} missed</button>`:''}${all.length>ans.length?`<button class="btn" data-act="unseen">${all.length-ans.length} unanswered</button>`:''}</div>`}</div>

  <div class="card"><h3>Tell it what you do not know</h3><p class="small muted">Name a gap in your own words. It is filed under a topic, pushed up the plan, and tested until your answers show it has closed.</p>

  ${st.sets.length?`<div class="card"><h3>Recent sets</h3><div class="tablewrap"><table><thead><tr><th>Set</th><th class="n">Correct</th><th class="n">%</th><th class="n">Completed</th><th>Date</th></tr></thead><tbody>${st.sets.slice(-10).reverse().map(s=>`<tr><td>${esc(s.title)}</td><td class="n">${s.c}/${s.n}</td><td class="n">${pct(s.c,s.n)}</td><td class="n">${pct(s.n,s.total)}%</td><td>${new Date(s.t).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div></div>`:''}`}

/* ---------- Actions ---------- */
async function run(label,fn){if(S.busy)return;S.busy=label;S.err='';render();try{await fn()}catch(e){S.err=errMsg(e);console.error(e)}S.busy='';render()}
function openLesson(L){S.lesson=L;S.lq={};S.quiz=null;beginAct('lesson',L.tid,L.title);render();scrollTo(0,0)}
function completeLesson(L,quiet){if(!L||L.done)return;L.done=Date.now();put('les_'+L.id,L);const x=st.lessons.find(y=>y.id===L.id);if(x)x.done=L.done;const t=tS(L.tid);t.fin=(t.fin||0)+1;t.last=Date.now();if(S.act&&S.act.k==='lesson')S.act.done=1;pullCards(L.tid,3);saveState();if(!quiet)toast('Marked complete.')}
async function startSession(sc){const c=COMMIT[st.prefs.commit],pl=plan(c.lessons,sc);S.lesson=null;P.stop(true);S.session={plan:pl.map(r=>r.t),i:0,len:c.len,next:null,loading:false};
  await run('Claude is writing your first lesson on '+pl[0].t.name+'…',async()=>{const L=await genLesson(pl[0].t,c.len);openLesson(L)});
  if(S.lesson&&S.session){if(st.prefs.auto)playSession();prefetch()}else S.session=null}
function playSession(){const ss=S.session,L0=S.lesson;playLesson(S.lesson,()=>{completeLesson(L0,true);if(S.session!==ss)return;if(ss.i+1<ss.plan.length){if(ss.next)advance();else ss.waiting=true}else finishSession(true)})}
async function prefetch(){const ss=S.session;if(!ss||ss.loading||ss.next||ss.i+1>=ss.plan.length)return;ss.loading=true;
  try{const L=await genLesson(ss.plan[ss.i+1],ss.len);if(S.session!==ss)return;ss.next=L;ss.loading=false;if(ss.waiting){ss.waiting=false;advance()}else if(S.lesson&&!S.busy)render()}
  catch(e){ss.loading=false;if(S.session===ss){toast('The next lesson could not be written. '+errMsg(e),6000);if(ss.waiting)finishSession(true)}}}
function advance(){const ss=S.session;if(!ss||!ss.next)return;ss.i++;const L=ss.next;ss.next=null;openLesson(L);if(st.prefs.auto)playSession();prefetch()}
function finishSession(completed){const ss=S.session;S.session=null;if(completed){day().done=1;saveState();toast('Checked in. Session complete.')}if(!P.on)render()}
